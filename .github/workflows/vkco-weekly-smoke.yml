name: VKCO Weekly Review R1.7 Smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/vkco-weekly-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      JOURNAL_JSONL: vkco-monitor/state/trade_journal.jsonl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache/restore@v4
        with:
          path: vkco-monitor/state
          key: vkco-weekly-smoke-${{ github.run_id }}
          restore-keys: |
            vkco-state-
      - run: pip install -r vkco-monitor/requirements.txt
      - name: Send real weekly review
        run: python vkco-monitor/weekly_review.py
