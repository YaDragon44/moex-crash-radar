name: Deploy Dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'scripts/collect_snapshot.py'
      - 'scripts/validate_dashboard_snapshot.py'
      - 'src/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install engine
        run: pip install -e .
      - name: Collect real MOEX snapshot
        run: python scripts/collect_snapshot.py
      - name: Validate dashboard contract
        run: python scripts/validate_dashboard_snapshot.py
      - name: Build static site
        run: |
          mkdir -p _site
          cp web/r044.html _site/index.html
          cp artifacts/market_snapshot.json _site/market_snapshot.json
          mkdir -p _site/idea-radar
          cp web/idea-radar/index.html _site/idea-radar/index.html
          mkdir -p _site/simple-entry-radar
          cp web/simple-entry-radar/live.html _site/simple-entry-radar/index.html
          if [ -f web/simple-entry-radar/positions.json ]; then cp web/simple-entry-radar/positions.json _site/simple-entry-radar/positions.json; fi
          mkdir -p _site/btc-entry-radar/data
          cp web/btc-entry-radar/index.html _site/btc-entry-radar/index.html
          if [ -d web/btc-entry-radar/data ]; then cp web/btc-entry-radar/data/*.json _site/btc-entry-radar/data/ || true; fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
