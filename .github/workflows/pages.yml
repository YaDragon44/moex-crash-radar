name: Deploy Dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'crypto-trader/**'
      - 'scripts/collect_snapshot.py'
      - 'scripts/collect_ta_market_snapshot.py'
      - 'scripts/update_ta_signal_history.py'
      - 'scripts/evaluate_ta_signal_performance.py'
      - 'scripts/validate_dashboard_snapshot.py'
      - 'artifacts/ta_market/current.json'
      - 'artifacts/ta_market/signal_history.json'
      - 'artifacts/ta_market/signal_performance.json'
      - 'src/**'
      - '.github/workflows/pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install engine
        run: pip install -e .
      - name: Collect real MOEX snapshot
        run: python scripts/collect_snapshot.py
      - name: Validate dashboard contract
        run: python scripts/validate_dashboard_snapshot.py
      - name: Collect TA Market snapshot
        run: python scripts/collect_ta_market_snapshot.py
      - name: Validate TA Market production snapshot
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/ta_market/current.json')
          j=json.loads(p.read_text(encoding='utf-8'))
          required=('SBERP','VKCO','OZPH')
          missing=[x for x in required if x not in j.get('securities',{})]
          if missing: raise SystemExit(f'missing securities: {missing}')
          if j.get('quality') != 'OK': raise SystemExit(f"quality must be OK, got {j.get('quality')}")
          for secid in required:
              z=j['securities'][secid]
              md=z.get('marketdata') or {}
              if not md: raise SystemExit(f'{secid}: marketdata missing')
              if not isinstance(md.get('LOTSIZE'), (int,float)) or md.get('LOTSIZE') <= 0:
                  raise SystemExit(f'{secid}: LOTSIZE missing/invalid: {md.get("LOTSIZE")}')
              for tf in ('D1','H1','M10'):
                  if not z.get('raw',{}).get(tf): raise SystemExit(f'{secid}: {tf} candles missing')
          if not j.get('imoex'): raise SystemExit('IMOEX history missing')
          if j.get('context_quality') != 'OK': raise SystemExit(f"context_quality must be OK, got {j.get('context_quality')}")
          if j.get('context_errors'): raise SystemExit(f"context_errors must be empty: {j.get('context_errors')}")
          ctx=j.get('context') or {}
          for key in ('breadth','cnyrub','brent'):
              if not ctx.get(key): raise SystemExit(f'context {key} missing')
          if not (ctx.get('brent') or {}).get('SECID'): raise SystemExit('Brent SECID missing')
          print('TA MARKET PRODUCTION SNAPSHOT + EXECUTION RISK GATE: PASS')
          PY
      - name: Update TA signal history
        run: python scripts/update_ta_signal_history.py
      - name: Validate TA signal history
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/ta_market/signal_history.json')
          if not p.exists(): raise SystemExit('signal_history.json missing')
          j=json.loads(p.read_text(encoding='utf-8'))
          events=j.get('events') or []
          if not events: raise SystemExit('signal history empty')
          for e in events:
              if e.get('ticker') not in ('SBERP','VKCO','OZPH'): raise SystemExit(f"bad ticker: {e.get('ticker')}")
              if e.get('tf') not in ('D1','H1','M10'): raise SystemExit(f"bad tf: {e.get('tf')}")
              if e.get('status') not in ('READY','WAIT','INVALID'): raise SystemExit(f"bad status: {e.get('status')}")
          print(f'TA SIGNAL HISTORY BUILD GATE: PASS · events={len(events)}')
          PY
      - name: Evaluate TA signal performance
        run: python scripts/evaluate_ta_signal_performance.py
      - name: Validate TA signal performance
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/ta_market/signal_performance.json')
          if not p.exists(): raise SystemExit('signal_performance.json missing')
          j=json.loads(p.read_text(encoding='utf-8'))
          if j.get('release') != 'R0.9.2 Production Observation': raise SystemExit('bad performance release')
          s=j.get('summary') or {}; q=j.get('sample_quality') or {}
          for k in ('signals','closed','wins','losses','open','ambiguous'):
              if not isinstance(s.get(k), int) or s.get(k) < 0: raise SystemExit(f'bad metric {k}: {s.get(k)}')
          if q.get('status') not in ('INSUFFICIENT','PRELIMINARY','USABLE'): raise SystemExit(f'bad sample quality: {q}')
          closed=s.get('closed',0); expected='INSUFFICIENT' if closed < 10 else 'PRELIMINARY' if closed < 30 else 'USABLE'
          if q.get('status') != expected: raise SystemExit(f'sample quality mismatch: {q.get("status")} vs {expected}')
          print(f"TA SIGNAL PERFORMANCE + SAMPLE QUALITY BUILD GATE: PASS · signals={s.get('signals')} · closed={closed} · quality={q.get('status')}")
          PY
      - name: Build static site
        run: |
          mkdir -p _site
          cp web/aggregator.html _site/index.html
          cp web/mvp.html _site/crash-radar.html
          cp web/r044.html _site/legacy.html
          cp artifacts/market_snapshot.json _site/market_snapshot.json
          mkdir -p _site/idea-radar
          cp web/idea-radar/index.html _site/idea-radar/index.html
          mkdir -p _site/portfolio-rf
          cp web/portfolio-rf/index.html _site/portfolio-rf/index.html
          mkdir -p _site/investor-radar
          cp web/investor-radar/index.html _site/investor-radar/index.html
          mkdir -p _site/simple-entry-radar
          cp web/simple-entry-radar/live.html _site/simple-entry-radar/index.html
          if [ -f web/simple-entry-radar/positions.json ]; then cp web/simple-entry-radar/positions.json _site/simple-entry-radar/positions.json; fi
          mkdir -p _site/btc-entry-radar
          cp web/btc-entry-radar/index.html _site/btc-entry-radar/index.html
          mkdir -p _site/btc-entry-radar/data
          if [ -f web/btc-entry-radar/data/current.json ]; then cp web/btc-entry-radar/data/current.json _site/btc-entry-radar/data/current.json; fi
          mkdir -p _site/ta-market/data
          cp web/ta-market/index.html _site/ta-market/index.html
          cp web/ta-market/production_patch.js _site/ta-market/production_patch.js
          python - <<'PY'
          from pathlib import Path
          p=Path('_site/ta-market/index.html')
          s=p.read_text(encoding='utf-8')
          marker='<script src="production_patch.js"></script>'
          if marker not in s:
              s=s.replace('</body>', marker+'</body>')
          p.write_text(s,encoding='utf-8')
          PY
          cp artifacts/ta_market/current.json _site/ta-market/data/current.json
          cp artifacts/ta_market/signal_history.json _site/ta-market/data/signal_history.json
          cp artifacts/ta_market/signal_performance.json _site/ta-market/data/signal_performance.json
          test -s _site/ta-market/data/current.json
          test -s _site/ta-market/data/signal_history.json
          test -s _site/ta-market/data/signal_performance.json
          test -s _site/ta-market/production_patch.js
          grep -q 'production_patch.js' _site/ta-market/index.html
          grep -q 'ta_market_risk_v085' _site/ta-market/production_patch.js
          grep -q 'Production Observation' _site/ta-market/production_patch.js
          grep -q 'Sample Quality' _site/ta-market/production_patch.js
          grep -q 'signal_performance.json' _site/ta-market/production_patch.js
          mkdir -p _site/vkco-dashboard
          cp web/vkco-dashboard/index.html _site/vkco-dashboard/index.html
          mkdir -p _site/crypto-trader
          cp crypto-trader/index.html _site/crypto-trader/index.html
          mkdir -p _site/crypto-radar
          cp web/crypto-radar/index.html _site/crypto-radar/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  public-health-check:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Verify TA Market public JSON
        shell: bash
        run: |
          set -euo pipefail
          URL="https://yadragon44.github.io/moex-crash-radar/ta-market/data/current.json"
          for attempt in {1..18}; do
            code=$(curl -L -sS -o /tmp/ta-market.json -w "%{http_code}" --connect-timeout 10 --max-time 20 "$URL" || true)
            if [ "$code" = "200" ] && python - <<'PY'
          import json
          j=json.load(open('/tmp/ta-market.json',encoding='utf-8'))
          ctx=j.get('context') or {}; secs=j.get('securities') or {}; required=('SBERP','VKCO','OZPH')
          ok=(j.get('quality')=='OK' and j.get('context_quality')=='OK' and not j.get('context_errors') and all(x in secs for x in required) and all(isinstance((secs[x].get('marketdata') or {}).get('LOTSIZE'),(int,float)) and (secs[x].get('marketdata') or {}).get('LOTSIZE')>0 for x in required) and bool(j.get('imoex')) and all(bool(ctx.get(x)) for x in ('breadth','cnyrub','brent')) and bool((ctx.get('brent') or {}).get('SECID')))
          raise SystemExit(0 if ok else 1)
          PY
            then echo "TA MARKET PUBLIC PRODUCTION JSON + LOTSIZE GATE: PASS"; exit 0; fi
            sleep 10
          done
          echo "TA MARKET PUBLIC PRODUCTION JSON + LOTSIZE GATE: FAIL"; exit 1
      - name: Verify TA Market public signal history
        shell: bash
        run: |
          set -euo pipefail
          URL="https://yadragon44.github.io/moex-crash-radar/ta-market/data/signal_history.json"
          for attempt in {1..18}; do
            code=$(curl -L -sS -o /tmp/ta-signal-history.json -w "%{http_code}" --connect-timeout 10 --max-time 20 "$URL" || true)
            if [ "$code" = "200" ] && python - <<'PY'
          import json
          j=json.load(open('/tmp/ta-signal-history.json',encoding='utf-8')); events=j.get('events') or []
          ok=bool(events) and all(e.get('ticker') in ('SBERP','VKCO','OZPH') and e.get('tf') in ('D1','H1','M10') and e.get('status') in ('READY','WAIT','INVALID') for e in events)
          raise SystemExit(0 if ok else 1)
          PY
            then echo "TA SIGNAL HISTORY PUBLIC GATE: PASS"; exit 0; fi
            sleep 10
          done
          echo "TA SIGNAL HISTORY PUBLIC GATE: FAIL"; exit 1
      - name: Verify TA Market public signal performance
        shell: bash
        run: |
          set -euo pipefail
          URL="https://yadragon44.github.io/moex-crash-radar/ta-market/data/signal_performance.json"
          for attempt in {1..18}; do
            code=$(curl -L -sS -o /tmp/ta-signal-performance.json -w "%{http_code}" --connect-timeout 10 --max-time 20 "$URL" || true)
            if [ "$code" = "200" ] && python - <<'PY'
          import json
          j=json.load(open('/tmp/ta-signal-performance.json',encoding='utf-8')); s=j.get('summary') or {}; q=j.get('sample_quality') or {}
          closed=s.get('closed',0); expected='INSUFFICIENT' if closed < 10 else 'PRELIMINARY' if closed < 30 else 'USABLE'
          ok=j.get('release')=='R0.9.2 Production Observation' and all(isinstance(s.get(k),int) and s.get(k)>=0 for k in ('signals','closed','wins','losses','open','ambiguous')) and q.get('status')==expected
          raise SystemExit(0 if ok else 1)
          PY
            then echo "TA SIGNAL PERFORMANCE + SAMPLE QUALITY PUBLIC GATE: PASS"; exit 0; fi
            sleep 10
          done
          echo "TA SIGNAL PERFORMANCE + SAMPLE QUALITY PUBLIC GATE: FAIL"; exit 1
      - name: Verify TA Market public HTML
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://yadragon44.github.io/moex-crash-radar/ta-market"
          for attempt in {1..12}; do
            bust="$(date +%s)-${attempt}"
            code=$(curl -L -sS -H 'Cache-Control: no-cache' -o /tmp/ta-market.html -w "%{http_code}" --connect-timeout 10 --max-time 20 "${BASE}/?v=${bust}" || true)
            js_code=$(curl -L -sS -H 'Cache-Control: no-cache' -o /tmp/ta-market-patch.js -w "%{http_code}" --connect-timeout 10 --max-time 20 "${BASE}/production_patch.js?v=${bust}" || true)
            if [ "$code" = "200" ] && [ "$js_code" = "200" ] && grep -q "TA Market Monitor" /tmp/ta-market.html && grep -q "production_patch.js" /tmp/ta-market.html && grep -q "snapshot age ≤25m" /tmp/ta-market-patch.js && grep -q "ta_market_risk_v085" /tmp/ta-market-patch.js && grep -q "Production Observation" /tmp/ta-market-patch.js && grep -q "Sample Quality" /tmp/ta-market-patch.js && grep -q "signal_performance.json" /tmp/ta-market-patch.js; then
              echo "TA MARKET PUBLIC HTML + SAFETY + RISK + OBSERVATION + SAMPLE QUALITY GATE: PASS"; exit 0
            fi
            sleep 10
          done
          echo "TA MARKET PUBLIC HTML + SAFETY + RISK + OBSERVATION + SAMPLE QUALITY GATE: FAIL"; exit 1
      - name: Verify Investor Radar public URL
        shell: bash
        run: |
          set -euo pipefail
          URL="https://yadragon44.github.io/moex-crash-radar/investor-radar/index.html"
          for attempt in {1..12}; do
            code=$(curl -L -sS -o /tmp/investor-radar.html -w "%{http_code}" --connect-timeout 10 --max-time 20 "$URL" || true)
            if [ "$code" = "200" ] && grep -q "Investor Radar R1.7.1" /tmp/investor-radar.html; then echo "PUBLIC HTTP GATE: PASS"; exit 0; fi
            sleep 10
          done
          echo "PUBLIC HTTP GATE: FAIL"; exit 1
