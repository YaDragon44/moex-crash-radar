name: Morning Dashboard MVP

on:
  workflow_dispatch:
  schedule:
    - cron: '1 5 * * *' # 08:01 Europe/Moscow (UTC+3)

permissions:
  contents: read

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Send Personal Morning Dashboard
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/personal_morning_dashboard.py

      - name: Run Morning Dashboard Agent
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/morning_dashboard_agent.py

      - name: Upload screenshots for diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morning-dashboard-screenshots
          path: artifacts/morning_dashboards/*.png
          if-no-files-found: ignore
