name: Morning Dashboard (legacy manual recovery)

on:
  # Daily delivery moved to the unified Cloudflare project via Make 7952861.
  # Stop that scheduler before using this legacy recovery workflow: ledgers are separate.
  workflow_dispatch:
    inputs:
      confirm_legacy:
        description: 'I have stopped the unified scheduler and intend to use legacy recovery'
        type: boolean
        required: true
        default: false

concurrency:
  group: morning-dashboard-daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deliver:
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_legacy == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Restore Telegram dashboard state
        uses: actions/cache/restore@v4
        with:
          path: artifacts/morning_dashboard_state.json
          key: morning-dashboard-state-${{ github.run_id }}
          restore-keys: |
            morning-dashboard-state-

      - name: Send Personal Morning Dashboard
        id: telegram
        env:
          MAKE_API_TOKEN: ${{ secrets.MAKE_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/personal_morning_dashboard.py

      - name: Delivery verification
        if: success()
        run: echo "PASS morning-dashboard delivery script completed"

      - name: Save Telegram dashboard state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: artifacts/morning_dashboard_state.json
          key: morning-dashboard-state-${{ github.run_id }}
