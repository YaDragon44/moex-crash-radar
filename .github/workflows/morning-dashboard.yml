name: Morning Dashboard MVP

on:
  workflow_dispatch:
  schedule:
    # GitHub scheduled workflows can be delayed under load. Two nearby triggers
    # provide a self-healing retry window; the delivery script remains the
    # single source of truth for the Telegram message.
    - cron: '1 5 * * *'   # 08:01 Europe/Moscow (UTC+3)
    - cron: '16 5 * * *'  # 08:16 Europe/Moscow fallback

  push:
    paths:
      - '.github/personal-morning-smoke-test'

concurrency:
  group: morning-dashboard-daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests
          playwright install --with-deps chromium

      - name: Send Personal Morning Dashboard
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/personal_morning_dashboard.py

      - name: Run Morning Dashboard Agent
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/morning_dashboard_agent.py

      - name: Upload screenshots for diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morning-dashboard-screenshots
          path: artifacts/morning_dashboards/*.png
          if-no-files-found: ignore
