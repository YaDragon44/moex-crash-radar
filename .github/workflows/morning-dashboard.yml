name: Morning Dashboard MVP

on:
  workflow_dispatch:
  schedule:
    # Independent fallback. GitHub schedules may start late, but this prevents
    # total delivery loss if the external 08:00 dispatcher is unavailable.
    - cron: '0 5 * * *'  # 08:00 Europe/Moscow (UTC+3)
  push:
    paths:
      - '.github/personal-morning-smoke-test'

concurrency:
  group: morning-dashboard-daily
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Restore Telegram dashboard state
        uses: actions/cache/restore@v4
        with:
          path: artifacts/morning_dashboard_state.json
          key: morning-dashboard-state-${{ github.run_id }}
          restore-keys: |
            morning-dashboard-state-

      - name: Send Personal Morning Dashboard
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/personal_morning_dashboard.py

      - name: Save Telegram dashboard state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: artifacts/morning_dashboard_state.json
          key: morning-dashboard-state-${{ github.run_id }}
