name: Live MOEX snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '15 7 * * 1-5'

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e .
      - name: Collect live IMOEX snapshot
        run: python scripts/collect_snapshot.py
      - uses: actions/upload-artifact@v4
        with:
          name: moex-market-snapshot
          path: artifacts/market_snapshot.json
