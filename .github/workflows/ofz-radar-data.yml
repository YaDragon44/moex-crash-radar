name: OFZ Radar Data

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * 1-5'
  push:
    branches: [main]
    paths:
      - 'scripts/collect_ofz_radar_snapshot.py'
      - 'scripts/ofz_cashflow_engine.py'
      - 'scripts/ofz_strategy_engine.py'
      - 'scripts/validate_ofz_strategy_r054.py'
      - 'scripts/validate_ofz_policy_r055.py'
      - '.github/workflows/ofz-radar-data.yml'

permissions:
  contents: write

concurrency:
  group: ofz-radar-data
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect official CBR and MOEX snapshot
        run: python scripts/collect_ofz_radar_snapshot.py
      - name: Validate cashflow and strategy contract
        shell: bash
        run: |
          python - <<'PY'
          import json
          j=json.load(open('web/ofz-radar/data/current.json',encoding='utf-8'))
          if j.get('version')!='0.5.3': raise SystemExit('wrong production version')
          if j.get('rawRegime') not in ('A','B','C','D','E'): raise SystemExit('regime invalid')
          if len(j.get('bonds') or [])!=4: raise SystemExit('bond set invalid')
          pq=j.get('portfolioQuality') or {}
          if not pq.get('ok') or not pq.get('economicSanity'): raise SystemExit(f'portfolio gate fail: {pq}')
          s=j.get('strategyComparison') or {}
          if not s.get('ready'): raise SystemExit('production strategy not ready')
          if (s.get('assumptions') or {}).get('protectiveSleeveYield')!=0.0: raise SystemExit('protective sleeve must remain 0%')
          print('OFZ R0.5.3 PRODUCTION CONTRACT: PASS')
          PY
      - name: Run R0.5.4 strategy validation matrix
        run: python scripts/validate_ofz_strategy_r054.py
      - name: Validate R0.5.4 report contract
        shell: bash
        run: |
          python - <<'PY'
          import json
          j=json.load(open('web/ofz-radar/data/strategy-validation.json',encoding='utf-8'))
          if j.get('version')!='0.5.4' or j.get('status')!='PASS': raise SystemExit('R0.5.4 validation fail')
          if not all((j.get('structuralChecks') or {}).values()): raise SystemExit('R0.5.4 structural checks fail')
          print('OFZ R0.5.4 STRATEGY VALIDATION CONTRACT: PASS')
          PY
      - name: Run R0.5.5 threshold policy comparison
        run: python scripts/validate_ofz_policy_r055.py
      - name: Validate R0.5.5 policy decision contract
        shell: bash
        run: |
          python - <<'PY'
          import json
          j=json.load(open('web/ofz-radar/data/policy-validation.json',encoding='utf-8'))
          if j.get('version')!='0.5.5' or j.get('status')!='PASS': raise SystemExit('R0.5.5 validation fail')
          if len(j.get('policies') or [])!=4: raise SystemExit('R0.5.5 policy set invalid')
          if not j.get('paretoPolicies'): raise SystemExit('R0.5.5 pareto set empty')
          if j.get('decision')!='NO_PRODUCTION_CHANGE': raise SystemExit('production change must remain blocked pending historical validation')
          print('OFZ R0.5.5 POLICY DECISION CONTRACT: PASS')
          PY
      - name: Commit validation artifacts if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git restore web/ofz-radar/data/current.json
          git add web/ofz-radar/data/strategy-validation.json web/ofz-radar/data/policy-validation.json
          if git diff --cached --quiet; then echo 'No validation data change'; exit 0; fi
          git commit -m 'data: update OFZ strategy and policy validation'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Verify raw public validation set
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://raw.githubusercontent.com/YaDragon44/moex-crash-radar/main/web/ofz-radar/data'
          ok=0
          for attempt in {1..12}; do
            c1=$(curl -L -sS -H 'Cache-Control: no-cache' -o /tmp/ofz.json -w '%{http_code}' --connect-timeout 10 --max-time 20 "${BASE}/current.json?v=${GITHUB_RUN_ID}-${attempt}" || true)
            c2=$(curl -L -sS -H 'Cache-Control: no-cache' -o /tmp/val.json -w '%{http_code}' --connect-timeout 10 --max-time 20 "${BASE}/strategy-validation.json?v=${GITHUB_RUN_ID}-${attempt}" || true)
            c3=$(curl -L -sS -H 'Cache-Control: no-cache' -o /tmp/pol.json -w '%{http_code}' --connect-timeout 10 --max-time 20 "${BASE}/policy-validation.json?v=${GITHUB_RUN_ID}-${attempt}" || true)
            if [ "$c1" = '200' ] && [ "$c2" = '200' ] && [ "$c3" = '200' ] && python - <<'PY'
          import json
          p=json.load(open('/tmp/ofz.json',encoding='utf-8'));v=json.load(open('/tmp/val.json',encoding='utf-8'));q=json.load(open('/tmp/pol.json',encoding='utf-8'))
          ok=p.get('version')=='0.5.3' and v.get('version')=='0.5.4' and v.get('status')=='PASS' and q.get('version')=='0.5.5' and q.get('status')=='PASS' and q.get('decision')=='NO_PRODUCTION_CHANGE'
          raise SystemExit(0 if ok else 1)
          PY
            then echo 'OFZ R0.5.5 RAW PUBLIC VALIDATION GATE: PASS'; ok=1; break; fi
            sleep 5
          done
          [ "$ok" = '1' ]
      - name: Verify public dashboard R0.5.3
        shell: bash
        run: |
          set -euo pipefail
          URL='https://yadragon44.github.io/moex-crash-radar/ofz-radar/'
          for attempt in {1..18}; do
            code=$(curl -L -sS -H 'Cache-Control: no-cache' -o /tmp/ofz.html -w '%{http_code}' --connect-timeout 10 --max-time 20 "${URL}?v=${GITHUB_RUN_ID}-${attempt}" || true)
            if [ "$code" = '200' ] && grep -q 'R0.5.3 Live Strategy Simulator' /tmp/ofz.html && grep -q 'strategyComparison' /tmp/ofz.html; then
              echo 'OFZ RADAR PUBLIC STRATEGY HTML GATE: PASS'; exit 0
            fi
            sleep 10
          done
          echo 'OFZ RADAR PUBLIC STRATEGY HTML GATE: FAIL'; exit 1
