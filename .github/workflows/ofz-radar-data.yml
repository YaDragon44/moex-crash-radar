name: OFZ Radar Data

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * 1-5'
  push:
    branches: [main]
    paths:
      - 'scripts/collect_ofz_radar_snapshot.py'
      - 'scripts/ofz_cashflow_engine.py'
      - 'scripts/ofz_strategy_engine.py'
      - 'scripts/validate_ofz_strategy_r054.py'
      - '.github/workflows/ofz-radar-data.yml'

permissions:
  contents: write

concurrency:
  group: ofz-radar-data
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect official CBR and MOEX snapshot
        run: python scripts/collect_ofz_radar_snapshot.py
      - name: Validate cashflow and strategy contract
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('web/ofz-radar/data/current.json')
          if not p.exists(): raise SystemExit('snapshot missing')
          j=json.loads(p.read_text(encoding='utf-8'))
          if j.get('version') != '0.5.3': raise SystemExit('wrong production version')
          pts=(j.get('curve') or {}).get('points') or []
          y10=[x.get('yield') for x in pts if x.get('years')==10]
          if not y10 or not isinstance(y10[0],(int,float)): raise SystemExit('10Y curve missing')
          bonds=j.get('bonds') or []
          if {x.get('secid') for x in bonds} != {'26254','26253','26247','26248'}: raise SystemExit('bond set invalid')
          for b in bonds:
              if not isinstance(b.get('price'),(int,float)) or b['price']<=0: raise SystemExit(f"{b.get('secid')}: price invalid")
              if not isinstance(b.get('ytm'),(int,float)) or b['ytm']<=0: raise SystemExit(f"{b.get('secid')}: ytm invalid")
              if b.get('scheduleStatus') not in ('FULL','PARTIAL_EXTENDED','SYNTHETIC'): raise SystemExit(f"{b.get('secid')}: schedule invalid {b.get('scheduleStatus')}")
          pq=j.get('portfolioQuality') or {}
          if not pq.get('ok') or not pq.get('economicSanity'): raise SystemExit(f'portfolio quality gate fail: {pq}')
          scenarios=j.get('portfolioScenarios') or []
          if [x.get('targetYield') for x in scenarios] != [14,12,10,8,5]: raise SystemExit('scenario set invalid')
          for x in scenarios:
              f=x.get('fiveYear') or {}
              if not f.get('ready') or not f.get('economicSanity'): raise SystemExit(f'scenario fail: {x.get("targetYield")}')
          s=j.get('strategyComparison') or {}
          if not s.get('ready'): raise SystemExit(f'strategy comparison not ready: {s}')
          for key in ('buyHold','active'):
              x=s.get(key) or {}
              if not x.get('ready') or not x.get('economicSanity'): raise SystemExit(f'{key} strategy fail')
          if (s.get('assumptions') or {}).get('protectiveSleeveYield') != 0.0: raise SystemExit('protective sleeve must remain explicit 0%')
          print('OFZ R0.5.3 PRODUCTION CONTRACT: PASS')
          PY
      - name: Run R0.5.4 strategy validation matrix
        run: python scripts/validate_ofz_strategy_r054.py
      - name: Validate R0.5.4 report contract
        shell: bash
        run: |
          python - <<'PY'
          import json
          j=json.load(open('web/ofz-radar/data/strategy-validation.json',encoding='utf-8'))
          if j.get('version')!='0.5.4' or j.get('status')!='PASS': raise SystemExit('R0.5.4 validation status not PASS')
          rows=j.get('scenarios') or []
          if [x.get('name') for x in rows] != ['FAST_FALL','HIGH_FOR_LONGER','FALL_REVERSAL','STRESS_RISE']: raise SystemExit('scenario matrix invalid')
          checks=j.get('structuralChecks') or {}
          if not checks or not all(checks.values()): raise SystemExit(f'structural checks fail: {checks}')
          print('OFZ R0.5.4 STRATEGY VALIDATION CONTRACT: PASS')
          PY
      - name: Commit snapshot and validation if changed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/ofz-radar/data/current.json web/ofz-radar/data/strategy-validation.json
          if git diff --cached --quiet; then echo 'No data change'; exit 0; fi
          git commit -m 'data: update OFZ radar snapshot and strategy validation'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Verify raw public snapshot and validation
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://raw.githubusercontent.com/YaDragon44/moex-crash-radar/main/web/ofz-radar/data'
          ok=0
          for attempt in {1..12}; do
            c1=$(curl -L -sS -H 'Cache-Control: no-cache' -o /tmp/ofz.json -w '%{http_code}' --connect-timeout 10 --max-time 20 "${BASE}/current.json?v=${GITHUB_RUN_ID}-${attempt}" || true)
            c2=$(curl -L -sS -H 'Cache-Control: no-cache' -o /tmp/val.json -w '%{http_code}' --connect-timeout 10 --max-time 20 "${BASE}/strategy-validation.json?v=${GITHUB_RUN_ID}-${attempt}" || true)
            if [ "$c1" = '200' ] && [ "$c2" = '200' ] && python - <<'PY'
          import json
          p=json.load(open('/tmp/ofz.json',encoding='utf-8'));v=json.load(open('/tmp/val.json',encoding='utf-8'))
          ok=p.get('version')=='0.5.3' and (p.get('strategyComparison') or {}).get('ready') and v.get('version')=='0.5.4' and v.get('status')=='PASS' and len(v.get('scenarios') or [])==4
          raise SystemExit(0 if ok else 1)
          PY
            then echo 'OFZ R0.5.4 RAW PUBLIC VALIDATION GATE: PASS'; ok=1; break; fi
            sleep 5
          done
          [ "$ok" = '1' ]
      - name: Verify public dashboard R0.5.3
        shell: bash
        run: |
          set -euo pipefail
          URL='https://yadragon44.github.io/moex-crash-radar/ofz-radar/'
          for attempt in {1..18}; do
            code=$(curl -L -sS -H 'Cache-Control: no-cache' -o /tmp/ofz.html -w '%{http_code}' --connect-timeout 10 --max-time 20 "${URL}?v=${GITHUB_RUN_ID}-${attempt}" || true)
            if [ "$code" = '200' ] && grep -q 'R0.5.3 Live Strategy Simulator' /tmp/ofz.html && grep -q 'strategyComparison' /tmp/ofz.html; then
              echo 'OFZ RADAR PUBLIC STRATEGY HTML GATE: PASS'; exit 0
            fi
            sleep 10
          done
          echo 'OFZ RADAR PUBLIC STRATEGY HTML GATE: FAIL'; exit 1
