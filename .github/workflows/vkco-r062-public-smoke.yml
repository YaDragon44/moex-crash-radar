name: VKCO R0.6.2 Public Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vkco-r062-public-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public dashboard and live candles
        shell: bash
        run: |
          set -euo pipefail
          DASH='https://yadragon44.github.io/moex-crash-radar/vkco-dashboard/'
          LIVE='https://raw.githubusercontent.com/YaDragon44/moex-crash-radar/vkco-live/status.json'
          ok=0
          for attempt in {1..18}; do
            bust="${GITHUB_RUN_ID}-${attempt}"
            dcode=$(curl -L -sS -H 'Cache-Control: no-cache' -o /tmp/vkco.html -w '%{http_code}' --connect-timeout 10 --max-time 20 "${DASH}?v=${bust}" || true)
            lcode=$(curl -L -sS -H 'Cache-Control: no-cache' -o /tmp/vkco-live.json -w '%{http_code}' --connect-timeout 10 --max-time 20 "${LIVE}?v=${bust}" || true)
            if [ "$dcode" = '200' ] && [ "$lcode" = '200' ] && grep -q 'R0.6.2 / ENGINE R1.8' /tmp/vkco.html && grep -Fq 'LS?.candles' /tmp/vkco.html && python - <<'PY'
          import json, math
          j=json.load(open('/tmp/vkco-live.json',encoding='utf-8'))
          candles=j.get('candles') or []
          assert j.get('schema_version') == 2
          assert j.get('dashboard_release') == 'R0.6.2'
          assert j.get('health') == 'OK'
          assert len(candles) == 72
          for c in candles:
              assert set(('t','end','o','h','l','c','v')).issubset(c)
              for k in ('o','h','l','c','v'):
                  assert isinstance(c[k], (int,float)) and math.isfinite(c[k])
          print('VKCO LIVE CANDLES CONTRACT: PASS')
          PY
            then ok=1; break; fi
            sleep 10
          done
          test "$ok" = '1'
          echo 'VKCO R0.6.2 PUBLIC CHART DATA GATE: PASS'
