name: R1.5.2 Authenticated FUTOI Gate
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/r1_5_2_authenticated_futoi_adapter.py'
      - 'scripts/r1_5_2_coverage_gate.py'
      - 'tests/test_r1_5_2_authenticated_futoi_adapter.py'
      - 'tests/test_r1_5_2_coverage_gate.py'
      - '.github/workflows/r1-5-2-authenticated-futoi-gate.yml'
      - 'config/r1_5_2_authenticated_source_contract.json'
      - 'docs/r1_5_2_authenticated_oi_futoi_acquisition_gate.md'
jobs:
  adapter-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install pytest
      - name: R1.5.2 regression
        run: python -m pytest -q tests/test_r1_5_2_authenticated_futoi_adapter.py tests/test_r1_5_2_coverage_gate.py
      - name: Contract checks
        run: |
          python - <<'PY'
          import json
          p=json.load(open('config/r1_5_2_authenticated_source_contract.json'))
          assert p['release']=='R1.5.2'
          assert p['production']=='NO-GO'
          assert p['secrets_policy']['runtime_only'] is True
          assert p['secrets_policy']['commit_allowed'] is False
          assert p['gates']['no_lookahead'] is True
          assert p['gates']['m1_requires_oi_data_ready'] is True
          assert p['gates']['m2_m3_require_futoi_data_ready'] is True
          print('R1.5.2 authenticated acquisition contract PASS')
          PY
