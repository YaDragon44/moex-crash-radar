name: R1.4.3.1 Historical Stop Gate

on:
  push:
    branches: [r1.4.3.1-historical-stop-gate]
    paths:
      - 'scripts/run_r1_4_3_1_stop_gate.py'
      - '.github/workflows/r1-4-3-1-stop-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run historical stop gate
        run: python scripts/run_r1_4_3_1_stop_gate.py
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: r1-4-3-1-stop-gate-report
          path: |
            artifacts/r1_4_3_1_stop_gate.json
            artifacts/r1_4_3_1_stop_gate.md
