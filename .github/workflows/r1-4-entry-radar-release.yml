name: R1.4 Entry Radar Release Gate

on:
  push:
    branches: [r1.4-simple-entry-radar-release]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Full regression
        run: pytest -q
      - name: Entry radar release gate
        run: pytest tests/test_simple_entry_radar_release.py -q
