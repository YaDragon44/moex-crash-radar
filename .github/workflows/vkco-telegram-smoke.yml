name: VKCO Telegram Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vkco-telegram-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send Telegram smoke test
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          token=os.environ['TELEGRAM_BOT_TOKEN']
          chat=os.environ['TELEGRAM_CHAT_ID']
          data=json.dumps({'chat_id':chat,'text':'✅ VKCO R1.0.1 Production: Telegram smoke test OK'}).encode()
          req=urllib.request.Request(f'https://api.telegram.org/bot{token}/sendMessage', data=data, headers={'Content-Type':'application/json'})
          with urllib.request.urlopen(req, timeout=20) as r:
              body=r.read().decode()
              print('telegram_http=', r.status)
              print('telegram_ok=', '"ok":true' in body.replace(' ',''))
          PY
