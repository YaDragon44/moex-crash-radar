name: BTC Crowd OI R1.2 Backtest

# Research-only workflow; production code is untouched.
on:
  push:
    branches:
      - research/btc-crowd-oi-r1.2
    paths:
      - 'research/btc_crowd_oi_r1_2.py'
      - 'research/btc_r1_3_ablation.py'
      - '.github/workflows/btc-crowd-oi-r1-2.yml'
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy
      - name: Normalize pandas 3 timestamp resolution
        run: |
          sed -i "s/pd.to_datetime(p\['timestamp'\],utc=True)/pd.to_datetime(p['timestamp'],utc=True).astype('datetime64[ns, UTC]')/" research/btc_crowd_oi_r1_2.py
          sed -i "s/pd.to_datetime(pd.to_numeric(oi\['timestamp'\]),unit='ms',utc=True)/pd.to_datetime(pd.to_numeric(oi['timestamp']),unit='ms',utc=True).astype('datetime64[ns, UTC]')/" research/btc_crowd_oi_r1_2.py
          sed -i "s/pd.to_datetime(pd.to_numeric(fu.iloc\[:,0\]),unit='ms',utc=True)/pd.to_datetime(pd.to_numeric(fu.iloc[:,0]),unit='ms',utc=True).astype('datetime64[ns, UTC]')/" research/btc_crowd_oi_r1_2.py
      - name: Run R1.2 backtest
        run: python research/btc_crowd_oi_r1_2.py
      - name: Run R1.3 ablation
        run: python research/btc_r1_3_ablation.py
      - name: Upload research results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: btc-crowd-oi-r1-2-results
          path: research/results/
          if-no-files-found: ignore
