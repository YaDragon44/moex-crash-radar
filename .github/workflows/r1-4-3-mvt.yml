name: R1.4.3 MVT Gate

on:
  push:
    branches: [r1.4.3-entry-quality-stop-engine]
  pull_request:
    branches: [main]
    paths:
      - 'web/simple-entry-radar/**'
      - 'tests/test_r1_4_3_mvt.py'
      - '.github/workflows/r1-4-3-mvt.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -e . pytest
      - name: Full regression
        run: pytest -q
      - name: R1.4.3 MVT contract gate
        run: pytest -q tests/test_r1_4_3_mvt.py
