name: BTC Entry Radar R1.4.8.2 One-shot Final Gate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/btc-entry-radar-r1-4-8-2-hotfix.yml'

permissions:
  actions: write
  contents: read

jobs:
  final-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger BTC public health workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run btc-entry-radar-public-health.yml --repo YaDragon44/moex-crash-radar --ref main
