name: R1.4.4 Exit Management Gate
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/run_r1_4_4_exit_management.py'
      - '.github/workflows/r1-4-4-exit-management.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/run_r1_4_4_exit_management.py
      - name: Contract gate
        run: |
          python - <<'PY'
          import json
          d=json.load(open('artifacts/r1_4_4_exit_management.json',encoding='utf8'))
          assert d['release']=='R1.4.4'
          assert set(d['aggregate'])=={'M0_FIXED_8H','M1_ATR_STOP','M2_BE_1R','M3_TREND_EXIT','M4_HYBRID'}
          assert d['management_status'] in ('NO_GO','CANDIDATE_ONLY')
          print('R1.4.4 contract PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r1-4-4-exit-management
          path: artifacts/r1_4_4_exit_management.*
