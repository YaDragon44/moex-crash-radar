name: R1.4 Simple Entry Radar

on:
  push:
    branches: [r1.4-simple-entry-radar]
  pull_request:
    branches: [r1.3.5-risk-geometry-redesign, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Full regression
        run: pytest
      - name: Dashboard contract gate
        run: pytest tests/test_simple_entry_radar.py -q
