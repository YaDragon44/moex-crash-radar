name: TA Market snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 7-15 * * 1-5'
  push:
    branches: [main]
    paths:
      - 'scripts/collect_ta_market_snapshot.py'
      - 'scripts/update_ta_signal_history.py'
      - 'scripts/evaluate_ta_signal_performance.py'
      - 'scripts/prepare_ta_ready_alert.py'
      - 'scripts/telegram_notify.py'
      - '.github/workflows/ta-market-snapshot.yml'

permissions:
  contents: write
  actions: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect SBERP VKCO OZPH snapshot
        run: python scripts/collect_ta_market_snapshot.py
      - name: Validate production snapshot
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/ta_market/current.json')
          j=json.loads(p.read_text(encoding='utf-8'))
          required=('SBERP','VKCO','OZPH')
          missing=[x for x in required if x not in j.get('securities',{})]
          if missing: raise SystemExit(f'missing securities: {missing}')
          if j.get('quality') != 'OK': raise SystemExit(f"quality must be OK, got {j.get('quality')}")
          for secid in required:
              z=j['securities'][secid]
              md=z.get('marketdata') or {}
              if not md: raise SystemExit(f'{secid}: marketdata missing')
              if not isinstance(md.get('LOTSIZE'), (int,float)) or md.get('LOTSIZE') <= 0:
                  raise SystemExit(f'{secid}: LOTSIZE missing/invalid: {md.get("LOTSIZE")}')
              for tf in ('D1','H1','M10'):
                  if not z.get('raw',{}).get(tf): raise SystemExit(f'{secid}: {tf} candles missing')
          if not j.get('imoex'): raise SystemExit('IMOEX history missing')
          if j.get('context_quality') != 'OK': raise SystemExit(f"context_quality must be OK, got {j.get('context_quality')}")
          if j.get('context_errors'): raise SystemExit(f"context_errors must be empty: {j.get('context_errors')}")
          ctx=j.get('context') or {}
          for key in ('breadth','cnyrub','brent'):
              if not ctx.get(key): raise SystemExit(f'context {key} missing')
          if not (ctx.get('brent') or {}).get('SECID'): raise SystemExit('Brent SECID missing')
          print('TA MARKET SCHEDULED PRODUCTION + LOTSIZE GATE: PASS')
          PY
      - name: Update signal history
        run: python scripts/update_ta_signal_history.py
      - name: Validate signal history
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/ta_market/signal_history.json')
          if not p.exists(): raise SystemExit('signal_history.json missing')
          j=json.loads(p.read_text(encoding='utf-8'))
          events=j.get('events') or []
          if not events: raise SystemExit('signal history empty')
          for e in events:
              if e.get('ticker') not in ('SBERP','VKCO','OZPH'): raise SystemExit(f"bad ticker: {e.get('ticker')}")
              if e.get('tf') not in ('D1','H1','M10'): raise SystemExit(f"bad tf: {e.get('tf')}")
              if e.get('status') not in ('READY','WAIT','INVALID'): raise SystemExit(f"bad status: {e.get('status')}")
          print(f'TA SIGNAL HISTORY GATE: PASS · events={len(events)}')
          PY
      - name: Evaluate model signal performance
        run: python scripts/evaluate_ta_signal_performance.py
      - name: Validate signal performance
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/ta_market/signal_performance.json')
          if not p.exists(): raise SystemExit('signal_performance.json missing')
          j=json.loads(p.read_text(encoding='utf-8'))
          s=j.get('summary') or {}
          if j.get('release') != 'R0.9.0 Production Observation': raise SystemExit('bad performance release')
          for k in ('signals','closed','wins','losses','open','ambiguous'):
              if not isinstance(s.get(k), int) or s.get(k) < 0: raise SystemExit(f'bad metric {k}: {s.get(k)}')
          for x in j.get('signals',[]):
              if x.get('result') not in ('WIN','LOSS','OPEN','AMBIGUOUS'): raise SystemExit(f"bad result: {x.get('result')}")
          print(f"TA SIGNAL PERFORMANCE GATE: PASS · signals={s.get('signals')} · closed={s.get('closed')}")
          PY
      - name: Prepare READY Telegram alert
        run: python scripts/prepare_ta_ready_alert.py
      - name: Send new READY to Telegram
        if: ${{ hashFiles('artifacts/ta_market/ready_alert.txt') != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/telegram_notify.py --file artifacts/ta_market/ready_alert.txt
      - name: Validate Telegram state
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/ta_market/telegram_state.json')
          if not p.exists(): raise SystemExit('telegram_state.json missing')
          j=json.loads(p.read_text(encoding='utf-8'))
          if not j.get('baseline_time'): raise SystemExit('Telegram baseline_time missing')
          if not isinstance(j.get('sent_event_keys'), list): raise SystemExit('sent_event_keys must be list')
          print(f"TA TELEGRAM STATE GATE: PASS · sent={len(j.get('sent_event_keys') or [])}")
          PY
      - name: Commit fresh TA Market state
        id: persist
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/ta_market/current.json artifacts/ta_market/signal_history.json artifacts/ta_market/signal_performance.json artifacts/ta_market/telegram_state.json
          if git diff --cached --quiet; then
            echo 'No TA Market changes'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m 'data: refresh TA market snapshot, signal history, performance and alert state'
          pushed=false
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              pushed=true
              break
            fi
            echo "Push race on attempt $attempt; retrying"
            sleep $((attempt * 2))
          done
          if [ "$pushed" != true ]; then
            echo 'Unable to persist TA Market state after 3 attempts'
            exit 1
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Dispatch Pages publish
        if: steps.persist.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
