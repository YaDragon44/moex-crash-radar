name: CI

on:
  push:
    branches: [main, r0.3-crash-engine]
    paths-ignore:
      - 'artifacts/**'
      - 'evidence/**'
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Unit tests
        run: pytest
      - name: Investor Radar R1.9.0 JavaScript tests
        run: |
          node web/investor-radar/trader-decision.test.js
          node web/investor-radar/recommendation-engine.test.js
          node web/investor-radar/sanctions-regulatory-registry.test.js
