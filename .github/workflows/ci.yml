name: CI

on:
  push:
    branches: [main, r0.3-crash-engine, r1.8-foundation]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Python unit tests
        run: pytest
      - name: Recommendation Engine syntax
        run: node --check web/investor-radar/recommendation-engine.js
      - name: Recommendation Engine regression
        run: node web/investor-radar/recommendation-engine.test.js
      - name: Risk Layer syntax
        run: node --check web/investor-radar/risk-layer.js
      - name: Risk Layer regression
        run: node web/investor-radar/risk-layer.test.js
      - name: Registry syntax
        run: |
          node --check web/investor-radar/issuer-risk-registry.js
          node --check web/investor-radar/sanctions-regulatory-registry.js
          node --check web/investor-radar/multiples-registry.js
      - name: Multiples Registry regression
        run: node web/investor-radar/multiples-registry.test.js
      - name: Valuation Engine syntax
        run: node --check web/investor-radar/valuation-engine.js
      - name: Valuation Engine regression
        run: node web/investor-radar/valuation-engine.test.js
      - name: R1.8 UI contract
        shell: bash
        run: |
          set -euo pipefail
          FILE=web/investor-radar/r1.8.html
          test -s "$FILE"
          grep -q "Investor Radar R1.8.8" "$FILE"
          grep -q "recommendation-engine.js" "$FILE"
          grep -q "risk-layer.js" "$FILE"
          grep -q "issuer-risk-registry.js" "$FILE"
          grep -q "sanctions-regulatory-registry.js" "$FILE"
          grep -q "valuation-engine.js" "$FILE"
          grep -q "multiples-registry.js" "$FILE"
          grep -q "InvestorRadarMultiples.get" "$FILE"
          grep -q "InvestorRadarValuation.assess" "$FILE"
          grep -q "VALTODAY,NUMTRADES" "$FILE"
          grep -q "iss.only=marketdata" "$FILE"
          grep -q "candles.json" "$FILE"
          ! grep -q "requiredReturn=19\|modelPE=100/requiredReturn" "$FILE"
          ! grep -q "рынокs\|рынокdata" "$FILE"
          echo "R1.8.8 verified multiples registry contract: PASS"
