name: CI

on:
  push:
    branches: [main, r0.3-crash-engine, r1.8-foundation]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Python unit tests
        run: pytest
      - name: Recommendation Engine syntax
        run: node --check web/investor-radar/recommendation-engine.js
      - name: Recommendation Engine regression
        run: node web/investor-radar/recommendation-engine.test.js
