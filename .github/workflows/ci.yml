name: CI

on:
  push:
    branches: [main, r0.3-crash-engine, r1.8-foundation, r1.8.14-sber-valuation]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Python unit tests
        run: pytest
      - name: Recommendation Engine
        run: |
          node --check web/investor-radar/recommendation-engine.js
          node web/investor-radar/recommendation-engine.test.js
      - name: Risk Layer
        run: |
          node --check web/investor-radar/risk-layer.js
          node web/investor-radar/risk-layer.test.js
      - name: Registries
        run: |
          node --check web/investor-radar/issuer-risk-registry.js
          node web/investor-radar/issuer-risk-registry.test.js
          node --check web/investor-radar/sanctions-regulatory-registry.js
          node web/investor-radar/sanctions-regulatory-registry.test.js
          node --check web/investor-radar/multiples-registry.js
          node web/investor-radar/multiples-registry.test.js
      - name: Bank issuer risk gate
        run: |
          node --check web/investor-radar/bank-issuer-risk-gate.js
          node web/investor-radar/bank-issuer-risk-gate.test.js
      - name: Peer Universe
        run: |
          node --check web/investor-radar/peer-universe-registry.js
          node web/investor-radar/peer-universe-registry.test.js
      - name: Peer Earnings Registry
        run: |
          node --check web/investor-radar/peer-earnings-registry.js
          node web/investor-radar/peer-earnings-registry.test.js
      - name: Peer P/E Data Factory
        run: |
          node --check web/investor-radar/peer-pe-data-factory.js
          node web/investor-radar/peer-pe-data-factory.test.js
      - name: Multiples Data Factory
        run: |
          node --check web/investor-radar/multiples-data-factory.js
          node web/investor-radar/multiples-data-factory.test.js
      - name: Valuation Engine
        run: |
          node --check web/investor-radar/valuation-engine.js
          node web/investor-radar/valuation-engine.test.js
      - name: SBER valuation registry
        run: |
          node --check web/investor-radar/sber-valuation-registry.js
          node web/investor-radar/sber-valuation-registry.test.js
      - name: Bank valuation gate
        run: |
          node --check web/investor-radar/bank-valuation-gate.js
          node web/investor-radar/bank-valuation-gate.test.js
      - name: Bank quality trend
        run: |
          node --check web/investor-radar/bank-quality-trend.js
          node web/investor-radar/bank-quality-trend.test.js
      - name: SBER MOEX runtime
        run: |
          node --check web/investor-radar/sber-moex-runtime.js
          node web/investor-radar/sber-moex-runtime.test.js
      - name: SBER valuation runtime integration
        run: |
          node --check web/investor-radar/sber-valuation-runtime-integration.js
          node web/investor-radar/sber-valuation-runtime-integration.test.js
      - name: SBER book value gate
        run: |
          node --check web/investor-radar/sber-book-value-gate.js
          node web/investor-radar/sber-book-value-gate.test.js
      - name: SBER share basis registry
        run: |
          node --check web/investor-radar/sber-share-basis-registry.js
          node web/investor-radar/sber-share-basis-registry.test.js
      - name: SBER equity attribution gate
        run: |
          node --check web/investor-radar/sber-equity-attribution-gate.js
          node web/investor-radar/sber-equity-attribution-gate.test.js
      - name: SBER valuation completeness gate
        run: |
          node --check web/investor-radar/sber-valuation-completeness-gate.js
          node web/investor-radar/sber-valuation-completeness-gate.test.js
      - name: SBER final valuation pipeline
        run: |
          node --check web/investor-radar/sber-final-valuation-pipeline.js
          node web/investor-radar/sber-final-valuation-pipeline.test.js
      - name: SBER unified recommendation pipeline
        run: |
          node --check web/investor-radar/sber-unified-recommendation-pipeline.js
          node web/investor-radar/sber-unified-recommendation-pipeline.test.js
      - name: R1.8 UI contract
        shell: bash
        run: |
          set -euo pipefail
          FILE=web/investor-radar/r1.8.html
          test -s "$FILE"
          grep -q "Investor Radar R1.8.11" "$FILE"
          grep -q "peer-universe-registry.js" "$FILE"
          grep -q "peer-earnings-registry.js" "$FILE"
          grep -q "peer-pe-data-factory.js" "$FILE"
          grep -q "InvestorRadarPeerUniverse.validate" "$FILE"
          grep -q "InvestorRadarPeerPEFactory.build" "$FILE"
          grep -q "peerQuote" "$FILE"
          grep -q "Verified peer P/E" "$FILE"
          grep -q "multiples-data-factory.js" "$FILE"
          grep -q "InvestorRadarMultiplesFactory.historicalPE" "$FILE"
          grep -q "yearEndCandles" "$FILE"
          grep -q "till=.*-12-31" "$FILE"
          grep -q "recommendation-engine.js" "$FILE"
          grep -q "risk-layer.js" "$FILE"
          grep -q "issuer-risk-registry.js" "$FILE"
          grep -q "sanctions-regulatory-registry.js" "$FILE"
          grep -q "valuation-engine.js" "$FILE"
          grep -q "VALTODAY,NUMTRADES" "$FILE"
          grep -q "iss.only=marketdata" "$FILE"
          grep -q "candles.json" "$FILE"
          ! grep -q "requiredReturn=19\|modelPE=100/requiredReturn" "$FILE"
          ! grep -q "рынокs\|рынокdata" "$FILE"
          echo "R1.8.23 SBER final valuation pipeline + R1.8 UI contract: PASS"
      - name: R1.8.24 SBER UI contract
        shell: bash
        run: |
          set -euo pipefail
          FILE=web/investor-radar/r1.8.24.html
          test -s "$FILE"
          grep -q "Investor Radar R1.8.24" "$FILE"
          grep -q "sber-final-valuation-pipeline.js" "$FILE"
          grep -q "sber-valuation-completeness-gate.js" "$FILE"
          grep -q "sber-equity-attribution-gate.js" "$FILE"
          grep -q "sber-moex-runtime.js" "$FILE"
          grep -q "boards/TQBR/securities/SBER.json" "$FILE"
          grep -q "Блокирующие данные" "$FILE"
          grep -q "Недостаточно данных для обоснованного вывода" "$FILE"
          grep -q "InvestorRadarSberFinalValuationPipeline.build" "$FILE"
          grep -q "InvestorRadarSberEquityAttribution.unresolved" "$FILE"
          ! grep -q "requiredReturn=19\|modelPE=100/requiredReturn" "$FILE"
          ! grep -q "рынокs\|рынокdata" "$FILE"
          echo "R1.8.24 SBER valuation UI contract: PASS"
      - name: R1.8.25 Live MOEX probe
        shell: bash
        run: |
          set -euo pipefail
          URL='https://iss.moex.com/iss/engines/stock/markets/shares/boards/TQBR/securities/SBER.json?iss.meta=off&iss.only=marketdata&marketdata.columns=SECID,LAST,LCURRENTPRICE,UPDATETIME'
          curl --fail --silent --show-error --retry 2 --connect-timeout 10 --max-time 30 "$URL" -o /tmp/sber.json
          python - <<'PY'
          import json, math
          d=json.load(open('/tmp/sber.json',encoding='utf-8'))
          b=d.get('marketdata') or {}
          cols=b.get('columns') or []
          rows=b.get('data') or []
          assert rows, 'MOEX marketdata empty'
          idx={c:i for i,c in enumerate(cols)}
          row=next((r for r in rows if r[idx['SECID']]=='SBER'), rows[0])
          vals=[]
          for k in ('LAST','LCURRENTPRICE'):
              if k in idx:
                  try: vals.append(float(row[idx[k]]))
                  except (TypeError,ValueError): pass
          assert any(math.isfinite(x) and x>0 for x in vals), 'MOEX SBER positive price missing'
          print('R1.8.25 live MOEX probe: PASS')
          PY
      - name: R1.8.25 Install browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: R1.8.25 Browser smoke and MOEX fail-closed
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --directory web/investor-radar >/tmp/radar-http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          sleep 2
          node web/investor-radar/r1.8.25-smoke.mjs
          echo "R1.8.28 bank issuer risk + sanctions semantics + browser smoke + live MOEX validation: PASS"
