name: CI

on:
  push:
    branches: [main, r0.3-crash-engine, r1.8-foundation]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Python unit tests
        run: pytest
      - name: Recommendation Engine syntax
        run: node --check web/investor-radar/recommendation-engine.js
      - name: Recommendation Engine regression
        run: node web/investor-radar/recommendation-engine.test.js
      - name: R1.8 UI contract
        shell: bash
        run: |
          set -euo pipefail
          FILE=web/investor-radar/r1.8.html
          test -s "$FILE"
          grep -q "Investor Radar R1.8.1" "$FILE"
          grep -q "recommendation-engine.js" "$FILE"
          grep -q "verified:false" "$FILE"
          grep -q "risk layer" "$FILE"
          grep -q "iss.only=marketdata" "$FILE"
          ! grep -q "рынокs\|рынокdata" "$FILE"
          echo "R1.8 UI contract: PASS"
