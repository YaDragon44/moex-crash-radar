name: CI

on:
  push:
    branches: [main, r0.3-crash-engine, r1.8-foundation]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Python unit tests
        run: pytest
      - name: Recommendation Engine
        run: |
          node --check web/investor-radar/recommendation-engine.js
          node web/investor-radar/recommendation-engine.test.js
      - name: Risk Layer
        run: |
          node --check web/investor-radar/risk-layer.js
          node web/investor-radar/risk-layer.test.js
      - name: Registries
        run: |
          node --check web/investor-radar/issuer-risk-registry.js
          node --check web/investor-radar/sanctions-regulatory-registry.js
          node --check web/investor-radar/multiples-registry.js
          node web/investor-radar/multiples-registry.test.js
      - name: Peer Universe
        run: |
          node --check web/investor-radar/peer-universe-registry.js
          node web/investor-radar/peer-universe-registry.test.js
      - name: Peer Earnings Registry
        run: |
          node --check web/investor-radar/peer-earnings-registry.js
          node web/investor-radar/peer-earnings-registry.test.js
      - name: Peer P/E Data Factory
        run: |
          node --check web/investor-radar/peer-pe-data-factory.js
          node web/investor-radar/peer-pe-data-factory.test.js
      - name: Multiples Data Factory
        run: |
          node --check web/investor-radar/multiples-data-factory.js
          node web/investor-radar/multiples-data-factory.test.js
      - name: Valuation Engine
        run: |
          node --check web/investor-radar/valuation-engine.js
          node web/investor-radar/valuation-engine.test.js
      - name: R1.8 UI contract
        shell: bash
        run: |
          set -euo pipefail
          FILE=web/investor-radar/r1.8.html
          test -s "$FILE"
          grep -q "Investor Radar R1.8.11" "$FILE"
          grep -q "peer-universe-registry.js" "$FILE"
          grep -q "peer-earnings-registry.js" "$FILE"
          grep -q "peer-pe-data-factory.js" "$FILE"
          grep -q "InvestorRadarPeerUniverse.validate" "$FILE"
          grep -q "InvestorRadarPeerPEFactory.build" "$FILE"
          grep -q "peerQuote" "$FILE"
          grep -q "Verified peer P/E" "$FILE"
          grep -q "multiples-data-factory.js" "$FILE"
          grep -q "InvestorRadarMultiplesFactory.historicalPE" "$FILE"
          grep -q "yearEndCandles" "$FILE"
          grep -q "till=.*-12-31" "$FILE"
          grep -q "recommendation-engine.js" "$FILE"
          grep -q "risk-layer.js" "$FILE"
          grep -q "issuer-risk-registry.js" "$FILE"
          grep -q "sanctions-regulatory-registry.js" "$FILE"
          grep -q "valuation-engine.js" "$FILE"
          grep -q "VALTODAY,NUMTRADES" "$FILE"
          grep -q "iss.only=marketdata" "$FILE"
          grep -q "candles.json" "$FILE"
          ! grep -q "requiredReturn=19\|modelPE=100/requiredReturn" "$FILE"
          ! grep -q "рынокs\|рынокdata" "$FILE"
          echo "R1.8.12 peer earnings verification + R1.8.11 UI contract: PASS"
