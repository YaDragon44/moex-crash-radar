name: Crypto Radar Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/collect_crypto_radar_snapshot.py'
      - 'scripts/enrich_crypto_risk.py'
      - 'scripts/update_crypto_observation_history.py'
      - 'scripts/evaluate_crypto_regime_outcomes.py'
      - '.github/workflows/crypto-radar-snapshot.yml'

permissions:
  contents: write

concurrency:
  group: crypto-radar-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve previous snapshot
        run: cp data/crypto-radar/snapshot.json /tmp/crypto-radar-prev.json || true
      - name: Collect crypto snapshot
        run: python scripts/collect_crypto_radar_snapshot.py
      - name: Enrich Risk / Regime / Transition / Action
        run: python scripts/enrich_crypto_risk.py /tmp/crypto-radar-prev.json
      - name: Update observation history
        run: python scripts/update_crypto_observation_history.py
      - name: Evaluate regime outcomes
        run: python scripts/evaluate_crypto_regime_outcomes.py
      - name: Validate snapshot history and outcomes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('data/crypto-radar/snapshot.json').read_text(encoding='utf-8'))
          h=json.loads(Path('data/crypto-radar/history.json').read_text(encoding='utf-8'))
          o=json.loads(Path('data/crypto-radar/outcomes.json').read_text(encoding='utf-8'))
          assert s['version']=='1.5'
          assert 'generated_at' in s
          assert set(s['source_status'])=={'coingecko_global','coingecko_stablecoins','gate_ticker','gate_contract_stats'}
          assert 0 <= s['crowd']['coverage_pct'] <= 100
          assert s['risk']['model']=='risk-v1-provisional'
          assert s['regime']['model']=='regime-v1-provisional'
          assert s['regime']['confirmation_rule']=='2 consecutive observations'
          assert set(s['action_engine']) >= {'investor','trader','why','provisional'}
          if s['crowd']['quality_passed']:
              assert s['crowd']['coverage_pct'] >= 70
              assert s['crowd']['score'] is not None
              assert s['risk']['coverage_pct'] >= 80
              assert s['risk']['score'] is not None
              assert s['risk']['status'] in {'LOW','MODERATE','ELEVATED','HIGH','CRITICAL'}
              assert s['regime']['status'] in {'RISK-ON','RISK-ON / OVERHEATED','NEUTRAL','DISTRIBUTION','RISK-OFF','PANIC'}
          else:
              assert s['crowd']['score'] is None
              assert s['risk']['score'] is None
              assert s['action_engine']['investor']=='WAIT'
              assert s['action_engine']['trader']=='WAIT'
          assert h['version']=='1.6'
          assert h['cadence_minutes']==15
          assert 1 <= h['record_count'] <= h['retention_records']
          assert h['last_generated_at']==s['generated_at']
          assert h['records'][-1]['generated_at']==s['generated_at']
          assert o['version']=='1.6.2'
          assert o['sample_quality'] in {'WARMUP','PRELIMINARY','USABLE'}
          assert set(o['summary'])=={'1h','4h','24h'}
          assert o['event_count']==len(o['events'])
          for e in o['events']:
              assert e['from_regime'] != e['to_regime']
              assert set(e['outcomes'])=={'1h','4h','24h'}
              for z in e['outcomes'].values():
                  assert z['status'] in {'OPEN','CLOSED'}
          print('CRYPTO RADAR R1.6.2 SNAPSHOT + HISTORY + OUTCOME GATE: PASS')
          PY
      - name: Commit crypto radar data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/crypto-radar/snapshot.json data/crypto-radar/history.json data/crypto-radar/outcomes.json
          if git diff --cached --quiet; then
            echo "No crypto radar changes"
          else
            git commit -m "data: update crypto radar observation and outcomes"
            git push
          fi
