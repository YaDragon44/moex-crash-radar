name: VKCO Monitor R1.8

on:
  push:
    branches: [main]
    paths:
      - "vkco-monitor/**"
      - ".github/workflows/vkco-monitor.yml"
  pull_request:
    paths:
      - "vkco-monitor/**"
      - ".github/workflows/vkco-monitor.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode
        required: true
        default: run
        type: choice
        options:
          - run
          - test_telegram
          - heartbeat
  schedule:
    - cron: "3,13,23,33,43,53 6-20 * * 1-5"
    - cron: "0 7 * * 1-5"

permissions:
  contents: write

concurrency:
  group: vkco-monitor-${{ github.event_name }}-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TRADING_CAPITAL_RUB: ${{ vars.TRADING_CAPITAL_RUB || '1000000' }}
      RISK_PCT: ${{ vars.RISK_PCT || '0.5' }}
      STATE_FILE: vkco-monitor/state/state.json
      JOURNAL_JSONL: vkco-monitor/state/trade_journal.jsonl
      JOURNAL_CSV: vkco-monitor/state/trade_journal.csv
      PUBLIC_STATUS_FILE: vkco-monitor/state/public_status.json
      MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || github.event.schedule == '0 7 * * 1-5' && 'heartbeat' || 'run' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: vkco-monitor/requirements.txt

      - name: Prepare state directory
        run: mkdir -p vkco-monitor/state

      - name: Restore signal state
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: vkco-monitor/state
          key: vkco-state-${{ github.run_id }}
          restore-keys: |
            vkco-state-

      - name: Install dependencies
        run: pip install -r vkco-monitor/requirements.txt pytest

      - name: Regression tests
        working-directory: vkco-monitor
        run: pytest -q

      - name: Run VKCO monitor
        if: github.event_name != 'pull_request'
        run: python vkco-monitor/run_r18.py

      - name: Export public dashboard state
        if: always() && github.event_name != 'pull_request'
        run: python vkco-monitor/export_status.py

      - name: Publish live dashboard state
        if: always() && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin vkco-live
          git worktree add /tmp/vkco-live origin/vkco-live
          cp "$PUBLIC_STATUS_FILE" /tmp/vkco-live/status.json
          cd /tmp/vkco-live
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          if git diff --cached --quiet; then
            echo "live_status_unchanged=1"
          else
            git commit -m "data(vkco): update live status"
            git push origin HEAD:vkco-live
          fi

      - name: Notify Telegram on failure
        if: failure() && github.event_name != 'pull_request'
        run: |
          python - <<'PY'
          import json, os, urllib.request
          token=os.environ['TELEGRAM_BOT_TOKEN']
          chat=os.environ['TELEGRAM_CHAT_ID']
          text='🔴 VKCO Monitor R1.8 — ERROR\nGitHub Actions run failed. Проверь workflow/logs.'
          data=json.dumps({'chat_id':chat,'text':text}).encode()
          req=urllib.request.Request(f'https://api.telegram.org/bot{token}/sendMessage', data=data, headers={'Content-Type':'application/json'})
          urllib.request.urlopen(req, timeout=20).read()
          PY

      - name: Save signal state and journal
        if: always() && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: vkco-monitor/state
          key: vkco-state-${{ github.run_id }}
