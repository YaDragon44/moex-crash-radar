name: VKCO Monitor R1.8

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Manual run mode
        required: true
        default: run
        type: choice
        options:
          - run
          - heartbeat

permissions:
  contents: write

concurrency:
  group: vkco-monitor-${{ github.event_name }}-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TRADING_CAPITAL_RUB: ${{ vars.TRADING_CAPITAL_RUB || '1000000' }}
      RISK_PCT: ${{ vars.RISK_PCT || '0.5' }}
      STATE_FILE: vkco-monitor/state/state.json
      JOURNAL_JSONL: vkco-monitor/state/trade_journal.jsonl
      JOURNAL_CSV: vkco-monitor/state/trade_journal.csv
      PUBLIC_STATUS_FILE: vkco-monitor/state/public_status.json
      DECISION_AUDIT_JSONL: vkco-monitor/state/decision_audit.jsonl
      STRATEGY2_STATE_FILE: vkco-monitor/state/strategy2_ema_state.json
      STRATEGY2_JOURNAL_JSONL: vkco-monitor/state/strategy2_ema_journal.jsonl
      STRATEGY3_STATE_FILE: vkco-monitor/state/strategy3_value_rsi_state.json
      STRATEGY3_JOURNAL_JSONL: vkco-monitor/state/strategy3_value_rsi_journal.jsonl
      STRATEGY4_STATE_FILE: vkco-monitor/state/strategy4_h1_state.json
      STRATEGY4_JOURNAL_JSONL: vkco-monitor/state/strategy4_h1_journal.jsonl
      STRATEGY4_DECISION_AUDIT_JSONL: vkco-monitor/state/strategy4_h1_decision_audit.jsonl
      MODE: ${{ inputs.mode }}
      TELEGRAM_DISABLED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: vkco-monitor/requirements.txt

      - name: Prepare state directory
        run: mkdir -p vkco-monitor/state

      - name: Restore signal state
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: vkco-monitor/state
          key: vkco-state-${{ github.run_id }}
          restore-keys: |
            vkco-state-

      - name: Install dependencies
        run: pip install -r vkco-monitor/requirements.txt pytest

      - name: Regression tests
        working-directory: vkco-monitor
        run: pytest -q

      - name: Run VKCO monitor
        if: github.event_name != 'pull_request'
        run: python vkco-monitor/run_r18.py

      - name: Export public dashboard state
        if: always() && github.event_name != 'pull_request'
        run: python vkco-monitor/export_status.py

      - name: Save signal state and journal
        if: always() && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: vkco-monitor/state
          key: vkco-state-${{ github.run_id }}
