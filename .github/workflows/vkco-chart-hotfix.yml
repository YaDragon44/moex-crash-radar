name: VKCO Chart Data Hotfix

on:
  push:
    branches: [vkco-r0.6.1-chart-data-hotfix]
    paths: ['.github/workflows/vkco-chart-hotfix.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: vkco-r0.6.1-chart-data-hotfix
      - name: Patch candle contract and self-test
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('web/vkco-dashboard/index.html')
          s=p.read_text(encoding='utf-8')
          old=s
          s=s.replace('R0.6 / ENGINE R1.8','R0.6.1 / ENGINE R1.8')
          s=s.replace('z.close??z.CLOSE','z.c??z.close??z.CLOSE')
          s=s.replace('z.open??z.OPEN','z.o??z.open??z.OPEN')
          s=s.replace('z.high??z.HIGH','z.h??z.high??z.HIGH')
          s=s.replace('z.low??z.LOW','z.l??z.low??z.LOW')
          s=s.replace('z.volume??z.VOLUME??0','z.v??z.volume??z.VOLUME??0')
          s=s.replace('z.end??z.END??z.begin??z.BEGIN','z.end??z.END??z.t??z.begin??z.BEGIN')
          if s==old: raise SystemExit('hotfix made no changes')
          for token in ('z.c??z.close','z.o??z.open','z.h??z.high','z.l??z.low','z.v??z.volume'):
              if token not in s: raise SystemExit(f'missing compact candle alias: {token}')
          p.write_text(s,encoding='utf-8')
          PY
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('artifacts/ta_market/current.json')
          j=json.loads(p.read_text(encoding='utf-8'))
          c=((j.get('securities') or {}).get('VKCO') or {}).get('raw',{}).get('M10') or []
          if not c: raise SystemExit('VKCO M10 missing')
          x=c[-1]
          if not all(k in x for k in ('o','h','l','c','v')): raise SystemExit(f'VKCO M10 compact candle contract mismatch: {x.keys()}')
          print('VKCO M10 CANDLE CONTRACT GATE: PASS')
          PY
      - name: Commit hotfix and remove temporary workflow
        run: |
          rm .github/workflows/vkco-chart-hotfix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add web/vkco-dashboard/index.html .github/workflows/vkco-chart-hotfix.yml
          git commit -m 'fix(vkco-dashboard): support compact M10 candle contract'
          git push origin HEAD:vkco-r0.6.1-chart-data-hotfix
