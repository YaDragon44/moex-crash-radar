name: R1.4.6.3 Trend Market Eligibility
on:
  pull_request:
    paths:
      - 'scripts/run_r1_4_6_3_trend_market_eligibility.py'
      - '.github/workflows/r1-4-6-3-trend-market-eligibility.yml'
  workflow_dispatch:
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Run frozen trend eligibility diagnostic
        run: python scripts/run_r1_4_6_3_trend_market_eligibility.py
      - name: Contract checks
        run: |
          python - <<'PY'
          import json
          d=json.load(open('artifacts/r1_4_6_3_trend_market_eligibility.json',encoding='utf-8'))
          assert set(d['aggregate'])=={'IS','VALIDATION','OOS'}
          assert len(d['eligibility'])==11
          for sp in d['aggregate'].values():
            for side in ('LONG','SHORT'):
              assert set(sp[side])=={'1','2','4','8'}
          print('R1.4.6.3 contract PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: r1-4-6-3-trend-market-eligibility
          path: |
            artifacts/r1_4_6_3_trend_market_eligibility.json
            artifacts/r1_4_6_3_state_events.json
