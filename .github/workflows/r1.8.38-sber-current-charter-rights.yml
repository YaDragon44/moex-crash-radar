name: R1.8.38 SBER Current Charter Rights

on:
  push:
    branches: [r1.8.14-sber-valuation]
    paths:
      - 'web/investor-radar/sber-current-charter-rights-gate.js'
      - 'web/investor-radar/sber-current-charter-rights-gate.test.js'
      - '.github/workflows/r1.8.38-sber-current-charter-rights.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Current charter rights gate
        run: |
          node --check web/investor-radar/sber-current-charter-rights-gate.js
          node web/investor-radar/sber-current-charter-rights-gate.test.js
      - name: Evidence boundary contract
        shell: bash
        run: |
          set -euo pipefail
          FILE=web/investor-radar/sber-current-charter-rights-gate.js
          grep -Fq "approved:'2025-07-25',registered:'2025-07-28'" "$FILE"
          grep -Fq 'liquidationValueRub:1000' "$FILE"
          grep -Fq 'historicalOnly:true' "$FILE"
          grep -Fq 'current_charter_text' "$FILE"
          grep -Fq 'current_equity_priority' "$FILE"
          grep -Fq 'Historical 2014 rights and 2025 dividend parity cannot be silently carried forward.' "$FILE"
          grep -Fq 'Недостаточно данных для обоснованного вывода' "$FILE"
          echo 'R1.8.38 current charter rights evidence boundary: PASS'
