name: R1.3.4 Roll Chain Risk Sensitivity

on:
  workflow_dispatch:
  push:
    branches:
      - r1.3.4-roll-chain-risk-sensitivity
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e . pytest
      - name: Full unit regression
        run: pytest -q
      - name: Historical multi-year roll-chain sensitivity replay
        run: |
          python scripts/run_r1_3_4_roll_chain_sensitivity.py \
            --start 2024-01-01 \
            --end 2026-08-31 \
            --families MX,SI,SR,GZ,LK \
            --stop-atrs 1.25,1.5,1.75,2.0 \
            --min-rrs 1.5,1.75,2.0,2.25 \
            --roll-business-days 5 \
            --min-trades 30 \
            --min-positive-share 0.60 \
            --slippage-ticks-rt 1.0 \
            --broker-fee-rub-rt 0.0 \
            --chunk-days 30 > r1_3_4_report.json
      - name: Upload research report
        uses: actions/upload-artifact@v4
        with:
          name: r1-3-4-roll-chain-risk-sensitivity-report
          path: r1_3_4_report.json
