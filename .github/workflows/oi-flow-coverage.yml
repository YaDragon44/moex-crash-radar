name: OI Flow Historical Coverage

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Historical FUTOI universe audit
        run: |
          python scripts/run_oi_flow_universe_audit.py \
            --start 2026-06-01 \
            --end 2026-08-15 \
            --output artifacts/oi_flow_universe_audit.json
      - name: Show report
        if: always()
        run: cat artifacts/oi_flow_universe_audit.json || true
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oi-flow-universe-audit
          path: artifacts/oi_flow_universe_audit.json
          if-no-files-found: error
