name: VKCO R1.1 Heartbeat Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vkco-heartbeat-smoke.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      MODE: heartbeat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r vkco-monitor/requirements.txt
      - name: Send real heartbeat
        run: python vkco-monitor/monitor.py
