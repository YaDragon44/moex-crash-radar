name: R1.4.1 Public Technical Validation
on:
  workflow_dispatch:
  push:
    branches: [r1.4.1-public-technical-validation]
    paths:
      - 'scripts/run_r1_4_1_public_validation.py'
      - '.github/workflows/r1-4-1-public-validation.yml'
  pull_request:
    paths:
      - 'scripts/run_r1_4_1_public_validation.py'
      - '.github/workflows/r1-4-1-public-validation.yml'
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run public technical validation
        run: python scripts/run_r1_4_1_public_validation.py --start 2026-06-01 --end 2026-09-01 --horizon 4 > r1_4_1_report.json
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: r1-4-1-public-validation-report
          path: r1_4_1_report.json
