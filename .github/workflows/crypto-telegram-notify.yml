name: Crypto Monitor Telegram Notify

on:
  push:
    branches: [main]
    paths:
      - 'data/crypto-monitor/latest.txt'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Send prepared monitor message to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/telegram_notify.py --file data/crypto-monitor/latest.txt
