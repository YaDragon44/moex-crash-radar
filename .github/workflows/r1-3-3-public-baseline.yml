name: R1.3.3 Public Baseline

on:
  workflow_dispatch:
    inputs:
      start:
        description: Start date YYYY-MM-DD
        required: true
        default: '2026-06-01'
      end:
        description: End date YYYY-MM-DD
        required: true
        default: '2026-08-31'
  push:
    branches:
      - r1.3.3-public-baseline
    paths:
      - 'src/moex_crash_radar/public_baseline.py'
      - 'src/moex_crash_radar/public_baseline_diagnostics.py'
      - 'src/moex_crash_radar/futures_data.py'
      - 'scripts/run_r1_3_3_public_baseline.py'
      - 'tests/test_public_baseline.py'
      - '.github/workflows/r1-3-3-public-baseline.yml'
  pull_request:
    paths:
      - 'src/moex_crash_radar/public_baseline.py'
      - 'src/moex_crash_radar/public_baseline_diagnostics.py'
      - 'src/moex_crash_radar/futures_data.py'
      - 'scripts/run_r1_3_3_public_baseline.py'
      - 'tests/test_public_baseline.py'
      - '.github/workflows/r1-3-3-public-baseline.yml'

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest
      - name: Unit regression
        run: python -m pytest tests/test_public_baseline.py -q
      - name: Public MOEX baseline replay
        env:
          START: ${{ github.event_name == 'workflow_dispatch' && inputs.start || '2026-06-01' }}
          END: ${{ github.event_name == 'workflow_dispatch' && inputs.end || '2026-08-31' }}
        run: |
          PYTHONPATH=src python scripts/run_r1_3_3_public_baseline.py \
            --start "$START" \
            --end "$END" \
            | tee r1_3_3_report.json
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r1-3-3-public-baseline-report
          path: r1_3_3_report.json
