name: Historical MOEX Evidence

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'scripts/run_historical_evidence.py'
      - 'src/moex_crash_radar/history.py'
      - 'src/moex_crash_radar/live_gate.py'
      - 'data/imoex_constituents_2019_2026.json'
      - '.github/workflows/historical-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e .
      - name: Historical MOEX evidence run
        run: python scripts/run_historical_evidence.py
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: historical-evidence
          path: artifacts/historical_evidence.json
          if-no-files-found: error
