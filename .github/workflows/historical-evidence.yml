name: Historical MOEX Evidence

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'scripts/run_historical_evidence.py'
      - 'scripts/run_blind_crash_replay.py'
      - 'scripts/run_positioning_audit.py'
      - 'scripts/run_positioning_incremental_value.py'
      - 'scripts/run_crowd_replay.py'
      - 'scripts/run_crowd_stability_replay.py'
      - 'scripts/run_crowd_incremental_value.py'
      - 'scripts/run_market_risk_replay.py'
      - 'scripts/run_market_risk_duplication_gate.py'
      - 'scripts/run_vulnerability_data_audit.py'
      - 'scripts/run_regime_replay.py'
      - 'scripts/run_regime_daily_replay.py'
      - 'scripts/run_reentry_replay.py'
      - 'scripts/run_reentry_quality_gate.py'
      - 'src/moex_crash_radar/history.py'
      - 'src/moex_crash_radar/live_gate.py'
      - 'src/moex_crash_radar/positioning.py'
      - 'src/moex_crash_radar/crowd.py'
      - 'src/moex_crash_radar/crowd_features.py'
      - 'src/moex_crash_radar/crowd_history.py'
      - 'src/moex_crash_radar/crowd_transition.py'
      - 'src/moex_crash_radar/market_risk.py'
      - 'src/moex_crash_radar/vulnerability.py'
      - 'src/moex_crash_radar/regime.py'
      - 'src/moex_crash_radar/reentry.py'
      - 'src/moex_crash_radar/brent_history.py'
      - 'src/moex_crash_radar/context_validation.py'
      - 'data/imoex_constituents_2019_2026.json'
      - '.github/workflows/historical-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e .
      - name: Historical MOEX evidence run
        run: python scripts/run_historical_evidence.py
      - name: Blind crash replay
        run: python scripts/run_blind_crash_replay.py
      - name: Historical positioning audit
        run: python scripts/run_positioning_audit.py
      - name: Positioning incremental value test
        run: python scripts/run_positioning_incremental_value.py
      - name: Historical crowd replay
        run: python scripts/run_crowd_replay.py
      - name: Crowd transition stability replay
        run: python scripts/run_crowd_stability_replay.py
      - name: Crowd incremental value test
        run: python scripts/run_crowd_incremental_value.py
      - name: Independent market risk replay
        run: python scripts/run_market_risk_replay.py
      - name: Market risk duplication gate
        run: python scripts/run_market_risk_duplication_gate.py
      - name: Vulnerability PIT data audit
        run: python scripts/run_vulnerability_data_audit.py
      - name: Historical regime semantic replay
        run: python scripts/run_regime_replay.py
      - name: Full daily regime stability replay
        run: python scripts/run_regime_daily_replay.py
      - name: Historical re-entry replay
        run: python scripts/run_reentry_replay.py
      - name: Re-entry quality and premature entry gate
        run: python scripts/run_reentry_quality_gate.py
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: historical-evidence
          path: |
            artifacts/historical_evidence.json
            artifacts/blind_crash_replay.json
            artifacts/positioning_audit.json
            artifacts/positioning_incremental_value.json
            artifacts/crowd_replay.json
            artifacts/crowd_stability_replay.json
            artifacts/crowd_incremental_value.json
            artifacts/market_risk_replay.json
            artifacts/market_risk_duplication_gate.json
            artifacts/vulnerability_data_audit.json
            artifacts/regime_replay.json
            artifacts/regime_daily_replay.json
            artifacts/reentry_replay.json
            artifacts/reentry_quality_gate.json
          if-no-files-found: error
