<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Investor Radar R1.8.54</title><style>body{margin:0;background:#071019;color:#e9f0f6;font:14px system-ui}.wrap{padding:20px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#0f1b27;border:1px solid #223445;border-radius:10px;padding:14px}.ticker{font-size:20px;font-weight:800}.pill{display:inline-block;margin:8px 0;padding:4px 8px;border:1px solid #33495d;border-radius:999px}.muted{color:#8ca0b3;font-size:12px}.green{color:#21d07a}.yellow{color:#f2cc42}.red{color:#ff5a5f}.gray{color:#8ca0b3}.risk,.valuation,.analysis-summary{margin-top:10px;padding-top:10px;border-top:1px solid #223445}.analysis-summary{background:#0b1621;border:1px solid #223445;border-radius:8px;padding:10px;margin-top:12px}.analysis-summary h3{font-size:13px;margin:0 0 8px}.analysis-summary p{margin:6px 0}.metric{display:flex;justify-content:space-between;gap:8px}.gate{margin:10px 0 16px;padding:10px 12px;background:#0f1b27;border-left:3px solid #f2cc42;border-radius:6px}.matrix-wrap{margin:12px 0 18px;overflow:auto;background:#0f1b27;border:1px solid #223445;border-radius:10px}.matrix{width:100%;border-collapse:collapse;min-width:1180px}.matrix th,.matrix td{padding:10px 9px;border-bottom:1px solid #223445;text-align:left;vertical-align:top}.matrix th{position:sticky;top:0;background:#122231;color:#a9bac9;font-size:12px}.matrix tr:last-child td{border-bottom:0}.matrix .tk{font-weight:800;font-size:15px}.status{display:inline-flex;align-items:flex-start;gap:6px}.dot{width:9px;height:9px;border-radius:50%;margin-top:4px;flex:0 0 9px}.dot.green{background:#21d07a}.dot.yellow{background:#f2cc42}.dot.red{background:#ff5a5f}.dot.gray{background:#66788a}.matrix-note{display:block;color:#8ca0b3;font-size:11px;margin-top:2px}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>Investor Radar R1.8.54</h1><p class="muted">SBER Verified Fundamentals Runtime Integration · Recommendation Engine + Full Risk Gate + Historical/Peer P/E Data Factory · FACT ≠ ANALYSIS ≠ DECISION</p><div id="matrix" class="matrix-wrap"></div><div id="gate" class="gate">Загрузка MOEX…</div><div id="cards" class="grid"></div></div><script src="./recommendation-engine.js"></script><script src="./risk-layer.js"></script><script src="./issuer-risk-registry.js"></script><script src="./sanctions-regulatory-registry.js"></script><script src="./valuation-engine.js"></script><script src="./multiples-registry.js"></script><script src="./multiples-data-factory.js"></script><script src="./peer-universe-registry.js"></script><script src="./peer-earnings-registry.js"></script><script src="./peer-pe-data-factory.js"></script><script src="./sber-valuation-registry.js"></script><script>
const T=['SBER','YDEX','X5','MOEX','VKCO','AFLT','GAZP'];
const F={YDEX:{series:[[2024,11.5],[2025,79.6]],eps:[[2024,30.47],[2025,209.69]],metric:'net_income_attributable_rub_bn',source:'Yandex FY2025 financial results / consolidated IFRS statements',sourceUrl:'https://ir.yandex.ru/financial-releases?report=q4&year=2025',asOf:'2025-12-31'},X5:{series:[[2023,78.299],[2024,103.314],[2025,83.080]],eps:[[2023,288.32],[2024,380.43],[2025,328.54]],metric:'net_income_attributable_rub_bn',source:'X5 audited consolidated IFRS 2025 / Note 23 EPS',sourceUrl:'https://www.x5.ru/wp-content/uploads/2026/03/auditorskoe-zaklyuchenie-i-finansovaya-otchetnost_pao-kcz-iks-5_2025.pdf',asOf:'2025-12-31'},MOEX:{series:[[2023,60.7695],[2024,79.2476],[2025,59.3907]],eps:[[2023,26.9],[2024,35.03],[2025,26.15]],metric:'net_income_attributable_rub_bn',source:'Moscow Exchange FY2025 IFRS results',sourceUrl:'https://www.moex.com/n98155',asOf:'2025-12-31'},AFLT:{series:[[2023,-8.862],[2024,58.501],[2025,104.692]],eps:[[2023,-2.3],[2024,14.9],[2025,26.7]],metric:'net_income_attributable_rub_bn',revenue:[[2023,612.194],[2024,856.785],[2025,902.261]],adjustedEbitda:[[2023,200.5],[2024,237.593],[2025,185.036]],source:'MOEX issuer financials / Aeroflot IFRS 2025',asOf:'2025-12-31'},GAZP:{series:[[2022,1225.807],[2023,-629.085],[2024,1218.543]],eps:[[2022,51.11],[2023,-27.58],[2024,49.15]],metric:'net_income_attributable_rub_bn',source:'Gazprom audited consolidated IFRS 2024 / Note 29 EPS',sourceUrl:'https://www.gazprom.ru/investors/disclosure/reports/2024/',asOf:'2024-12-31'},VKCO:{series:[[2023,-33.716],[2024,-95.496],[2025,-25.423]],eps:[[2023,-149],[2024,-422],[2025,-63]],metric:'net_income_attributable_rub_bn',revenue:[[2023,120.3],[2024,147.573],[2025,160.0]],source:'MOEX issuer financials / VK IFRS 2025',asOf:'2025-12-31'}};
const $=s=>document.querySelector(s),P={},RISK={},LIQ={},VAL={},AUTOPE={},PEERPE={},PEERPRICES={};
function cagr(a,b,y){return a>0&&b>0&&y>0?(Math.pow(b/a,1/y)-1)*100:null}
function sberRegistry(){return window.InvestorRadarSberValuation||null}
function sberAudit(){return sberRegistry()?.audit?.()||{status:'LOCK',epsOk:false}}
function fg(t){if(t==='SBER'){const s=sberRegistry()?.SBER?.epsSeries||[],a=sberAudit();if(a.status!=='VERIFIED_INPUT'||s.length<3)return null;return cagr(Number(s[0].eps),Number(s.at(-1).eps),Number(s.at(-1).year)-Number(s[0].year))}let f=F[t],s=f?.series;if(!s||s.length<3||f?.metric!=='net_income_rub_bn'&&f?.metric!=='net_income_attributable_rub_bn')return null;return cagr(s[0][1],s.at(-1)[1],s.at(-1)[0]-s[0][0])}
function fundamentalVerified(t){if(t==='SBER')return sberAudit().status==='VERIFIED_INPUT';const f=F[t];if(!f||!f.source||!f.asOf)return false;const earningsMetric=f.metric==='net_income_rub_bn'||f.metric==='net_income_attributable_rub_bn';const earningsSeries=earningsMetric&&Array.isArray(f.series)&&f.series.length>=3&&f.series.every(x=>Number.isInteger(Number(x[0]))&&Number.isFinite(Number(x[1])));const epsOk=Array.isArray(f.eps)&&f.eps.length>=3&&f.eps.every(x=>Number.isInteger(Number(x[0]))&&Number.isFinite(Number(x[1])));return earningsSeries||epsOk}
function sourceOf(t){return t==='SBER'?(sberRegistry()?.SBER?.source||null):(F[t]?.source||null)}
function eps(t){if(t==='SBER'){const s=sberRegistry()?.SBER?.epsSeries||[];return s.at(-1)?.eps??null}return F[t]?.eps?.at(-1)?.[1]??null}
function epsSeries(t){if(t==='SBER')return (sberRegistry()?.SBER?.epsSeries||[]).filter(x=>x?.verified===true).map(x=>({year:+x.year,eps:+x.eps,verified:true,source:x.source,asOf:x.asOf}));return (F[t]?.eps||[]).map(x=>({year:x[0],eps:x[1],verified:!!F[t]?.source&&Number.isFinite(Number(x[1]))&&!!F[t]?.asOf,source:F[t]?.source||null,asOf:F[t]?.asOf||null}))}
async function quoteAndLiquidity(t){let u=`https://iss.moex.com/iss/engines/stock/markets/shares/boards/TQBR/securities/${t}.json?iss.meta=off&iss.only=marketdata&marketdata.columns=SECID,LAST,LCURRENTPRICE,UPDATETIME,VALTODAY,NUMTRADES`,r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);let d=await r.json(),a=d.marketdata?.data?.[0];if(!a)throw new Error('нет marketdata');return {price:a[1]??a[2],time:a[3],turnoverRub:Number(a[4]),numTrades:Number(a[5])}}
async function peerQuote(t){let u=`https://iss.moex.com/iss/engines/stock/markets/shares/securities/${t}.json?iss.meta=off&iss.only=marketdata&marketdata.columns=SECID,LAST,LCURRENTPRICE,UPDATETIME`,r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);let d=await r.json(),a=d.marketdata?.data?.find(x=>x[0]===t)||d.marketdata?.data?.[0];if(!a)throw new Error('нет marketdata');let price=Number(a[1]??a[2]);if(!Number.isFinite(price)||price<=0)throw new Error('нет цены');return {price,source:'MOEX ISS',asOf:new Date().toISOString().slice(0,10),time:a[3]}}
async function candles(t){let from=new Date();from.setFullYear(from.getFullYear()-1);let u=`https://iss.moex.com/iss/engines/stock/markets/shares/securities/${t}/candles.json?iss.meta=off&interval=24&from=${from.toISOString().slice(0,10)}&candles.columns=begin,close`,r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);let d=await r.json();return(d.candles?.data||[]).map(x=>({date:x[0],close:+x[1]})).filter(x=>x.close>0)}
async function yearEndCandles(t){const years=[...new Set(epsSeries(t).map(x=>x.year))],out=[];for(const y of years){let u=`https://iss.moex.com/iss/engines/stock/markets/shares/securities/${t}/candles.json?iss.meta=off&interval=24&from=${y}-12-01&till=${y}-12-31&candles.columns=begin,close`,r=await fetch(u,{cache:'no-store'});if(!r.ok)continue;let d=await r.json(),rows=d.candles?.data||[];if(rows.length){let x=rows.at(-1);out.push({date:x[0],close:+x[1]})}}return out}
function valuationInput(t){const m=window.InvestorRadarMultiples.get(t),series=epsSeries(t),latest=series.at(-1),e=latest?.eps??null,auto=AUTOPE[t],peer=PEERPE[t],src=sourceOf(t);const epsVerified=latest?.verified===true&&!!latest?.source&&!!latest?.asOf&&Number.isFinite(Number(e));return {eps:e,epsVerified,historicalPE:auto?.historicalPE||m.historicalPE,peerPE:peer?.peerPE||m.peerPE,source:(epsVerified&&auto?.verified&&peer?.verified)?`MOEX ISS + ${src} + verified peer EPS sources`:null,asOf:(epsVerified&&auto?.verified&&peer?.verified)?new Date().toISOString().slice(0,10):null}}
function valuation(t){return VAL[t]||window.InvestorRadarValuation.assess(valuationInput(t))}
function input(t){let rr=RISK[t],v=valuation(t),src=sourceOf(t);return {ticker:t,price:P[t],fundamental:{verified:fundamentalVerified(t),growthCagr:fg(t)},valuation:v,risk:{verified:rr?.verified===true,critical:rr?.critical===true,thesisBroken:rr?.thesisBroken===true,score:rr?.score,items:rr?.items||['Risk layer не рассчитан'],issuerProvenance:rr?.issuerProvenance||{verified:false,derivedBy:null},sanctions:rr?.sanctions||{verified:false,level:'UNKNOWN'}},portfolio:{},facts:src?[`Фундаментальный ряд подтверждён: ${src}`]:[],trigger:'Изменение фундаментала/оценки или прохождение всех verification gates.'}}
function cls(light){return light==='ЗЕЛЁНЫЙ'?'green':light==='ЖЁЛТЫЙ'?'yellow':light==='КРАСНЫЙ'?'red':'gray'}
function rub(x){return Number.isFinite(x)?x.toLocaleString('ru-RU',{maximumFractionDigits:0})+' ₽':'—'}
function valuationBlock(t){let v=valuation(t),a=AUTOPE[t],p=PEERPE[t],u=window.InvestorRadarPeerUniverse.validate(t);return `<div class="valuation"><div class="metric"><span class="muted">Valuation gate</span><b class="${v.verified?'green':'gray'}">${v.status}</b></div><div class="metric"><span>Historical P/E factory</span><span>${a?.status||'LOCK'}</span></div><div class="metric"><span>Auto historical P/E</span><span>${a?.historicalPE?.length||0}</span></div><div class="metric"><span>Peer universe</span><span>${u.status}</span></div><div class="metric"><span>Peer tickers</span><span>${u.peers.length?u.peers.join(', '):'LOCK'}</span></div><div class="metric"><span>Peer P/E factory</span><span>${p?.status||'LOCK'}</span></div><div class="metric"><span>Verified peer P/E</span><span>${p?.peerPE?.length||0}</span></div><div class="metric"><span>Historical P/E median</span><span>${Number.isFinite(v.historicalMedianPE)?v.historicalMedianPE.toFixed(1):'LOCK'}</span></div><div class="metric"><span>Peer P/E median</span><span>${Number.isFinite(v.peerMedianPE)?v.peerMedianPE.toFixed(1):'LOCK'}</span></div><div class="metric"><span>Fair-value band</span><span>${Number.isFinite(v.low)&&Number.isFinite(v.high)?rub(v.low)+' – '+rub(v.high):'LOCK'}</span></div><div class="muted">${v.verified?v.method:(p?.excluded?.length?'Excluded peers: '+p.excluded.map(x=>x.ticker+':'+x.reason).join(', '):(u.note||'Недостаточно данных для обоснованного вывода.'))}</div></div>`}
function riskBlock(t){let r=RISK[t];if(!r)return '<div class="risk muted">Risk layer: загрузка…</div>';let v=r.metrics?.annualizedVolatility,m=r.metrics?.maxDrawdown,turn=r.metrics?.turnoverRub,trades=r.metrics?.numTrades;return `<div class="risk"><div class="metric"><span class="muted">Full risk gate</span><b class="${r.verified?'green':r.status==='PARTIAL'?'yellow':'gray'}">${r.status}</b></div><div class="metric"><span>Market</span><span>${r.marketVerified?'PASS':'LOCK'}</span></div><div class="metric"><span>Liquidity</span><span>${r.liquidityVerified?'PASS':'LOCK'}</span></div><div class="metric"><span>Issuer</span><span>${r.issuerVerified?'PASS':'LOCK'}</span></div><div class="metric"><span>Sanctions/regulatory</span><span>${r.regulatoryVerified?'PASS':'LOCK'}</span></div><div class="metric"><span>Sanctions level</span><span>${r.sanctions?.level||'UNKNOWN'}</span></div><div class="metric"><span>Volatility</span><span>${Number.isFinite(v)?v.toFixed(1)+'%':'—'}</span></div><div class="metric"><span>Max drawdown</span><span>${Number.isFinite(m)?m.toFixed(1)+'%':'—'}</span></div><div class="metric"><span>Turnover today</span><span>${rub(turn)}</span></div><div class="metric"><span>Trades today</span><span>${Number.isFinite(trades)?trades.toLocaleString('ru-RU'):'—'}</span></div><div class="metric"><span>Risk score</span><span>${Number.isFinite(r.score)?r.score.toFixed(1)+'/100':'LOCK'}</span></div><div class="muted">${r.gateReason}</div></div>`}
function analysisSummary(t,r){let v=valuation(t),rr=RISK[t],fv=fundamentalVerified(t),price=P[t],missing=r.gate?.missing||[];let verdict=r.action||'WAIT';let confidence=r.confidence||'низкая';let picture=[];if(fv)picture.push('Фундаментальные данные доступны');else picture.push('фундаментал LOCK');if(v?.verified)picture.push('оценка подтверждена');else picture.push('valuation LOCK');if(rr?.verified)picture.push('risk gate PASS');else picture.push('risk gate '+(rr?.status||'LOCK'));let positive=fv?(Number.isFinite(fg(t))&&fg(t)>0?'положительная динамика фундаментального ряда':'есть подтверждённый фундаментальный ряд'):'подтверждённая рыночная цена MOEX';let blocker=missing.length?missing.join(', '):(!v?.verified?'недостаточно данных для полной оценки':(!rr?.verified?'risk gate не пройден':'критичных блокеров не выявлено'));let trigger=r.trigger||'Повторная оценка после обновления данных.';let conclusion=r.gate?.ok?`${verdict}: действовать только в рамках указанного триггера и риска.`:`WAIT: не принимать инвестиционное решение до снятия LOCK по критичным данным.`;return `<div class="analysis-summary"><h3>ИТОГ АНАЛИЗА</h3><div class="metric"><span>Вердикт</span><b class="${cls(r.light)}">${verdict}</b></div><div class="metric"><span>Уверенность</span><span>${confidence}</span></div><p><b>Картина:</b> ${picture.join(' · ')}.</p><p><b>Что хорошо:</b> ${positive}.</p><p><b>Что мешает:</b> ${blocker}.</p><p><b>Условие действия:</b> ${trigger}</p><p><b>Вывод:</b> ${conclusion}</p></div>`}
function traffic(kind,text,note=''){return `<span class="status"><i class="dot ${kind}"></i><span>${text}${note?`<span class="matrix-note">${note}</span>`:''}</span></span>`}
function matrixCell(t,key){const rr=RISK[t],u=window.InvestorRadarPeerUniverse.validate(t),a=AUTOPE[t],p=PEERPE[t],v=valuation(t),rec=window.InvestorRadarRecommendation.decide(input(t));const es=epsSeries(t),latest=es.at(-1),positive=es.filter(x=>Number(x.eps)>0).length;
 if(key==='fundamental'){if(t==='GAZP'&&fundamentalVerified(t))return traffic('yellow','PASS','аудировано до 2024');if(t==='YDEX'&&!fundamentalVerified(t))return traffic('yellow','INSUFFICIENT','2 сопоставимых года IFRS');return fundamentalVerified(t)?traffic('green','PASS'):traffic('red','LOCK');}
 if(key==='eps'){if(t==='YDEX')return traffic('yellow','INSUFFICIENT','2 verified года; valuation history < 3');if(t==='GAZP')return traffic('green','PASS','аудировано до 2024');if(t==='VKCO')return traffic('yellow','PASS','EPS < 0');return latest?.verified===true?traffic('green','PASS'):traffic('red','LOCK','provenance');}
 if(key==='hist'){if(t==='VKCO')return traffic('gray','N/A','P/E неприменим: EPS < 0');if(a?.verified)return traffic('green','PASS');if(t==='AFLT')return traffic('yellow','INSUFFICIENT','2 положительных EPS');if(t==='GAZP')return traffic('yellow','INSUFFICIENT','2 положительных EPS из 3 лет');if(t==='YDEX')return traffic('yellow','INSUFFICIENT','только 2 сопоставимых года');return traffic('red','LOCK',positive<3?'недостаточно истории':'verification gate');}
 if(key==='peer'){if(t==='VKCO')return traffic('gray','N/A','P/E неприменим: EPS < 0');if(p?.verified)return traffic('green','PASS');if(t==='YDEX')return traffic('yellow','INSUFFICIENT','peers убыточны');if(t==='X5')return traffic('yellow','INSUFFICIENT','только LENT usable');if(u.status!=='APPROVED_UNIVERSE')return traffic('yellow','LIMITED','нет утверждённых ≥2 peers');return traffic('yellow','INSUFFICIENT','< 2 usable peers');}
 if(key==='issuer'){const ir=window.InvestorRadarIssuerRisk.get(t);return ir?.issuer?.provenanceVerified?traffic(ir.issuer.riskLevel==='LOW'?'green':'yellow','PASS',ir.issuer.riskLevel):traffic('red','LOCK');}
 if(key==='sanctions'){const s=window.InvestorRadarSanctions.get(t);if(!s.verified)return traffic('red','LOCK');return traffic(s.level==='HIGH'?'yellow':'green','PASS',s.status==='SECTORAL_RESTRICTIONS'?'HIGH · sectoral':s.level);}
 if(key==='risk'){return rr?.verified?traffic(rr.level==='HIGH'?'red':rr.level==='MEDIUM'?'yellow':'green','PASS',rr.level):traffic('red','LOCK',rr?.missing?.join(', ')||'loading');}
 if(key==='rec'){return rec.gate?.ok?traffic(rec.light==='ЗЕЛЁНЫЙ'?'green':rec.light==='КРАСНЫЙ'?'red':'yellow',rec.action):traffic('yellow','WAIT',(rec.gate?.missing||[]).join(', '));}}
function renderMatrix(){const cols=[['price','Текущая цена'],['fundamental','Fundamental'],['eps','EPS'],['hist','Hist P/E'],['peer','Peer P/E'],['issuer','Issuer Risk'],['sanctions','Sanctions'],['risk','Full Risk'],['rec','Recommendation / итог']];$('#matrix').innerHTML=`<table class="matrix"><thead><tr><th>Ticker</th>${cols.map(x=>`<th>${x[1]}</th>`).join('')}</tr></thead><tbody>${T.map(t=>`<tr><td class="tk">${t}</td>${cols.map(x=>`<td>${x[0]==='price'?(Number.isFinite(P[t])?`<b>${P[t].toLocaleString('ru-RU')} ₽</b>`:'<span class="muted">загрузка…</span>'):matrixCell(t,x[0])}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
function render(){const E=window.InvestorRadarRecommendation;renderMatrix();$('#cards').innerHTML=T.map(t=>{let r=E.decide(input(t));return `<div class="card" data-ticker="${t}"><div class="ticker">${t}</div><div class="pill ${cls(r.light)}">${r.light} · ${r.action}</div><div><b>Цена:</b> ${Number.isFinite(P[t])?P[t].toLocaleString('ru-RU')+' ₽':'—'}</div><div><b>Оценка:</b> ${r.valuation}</div><div><b>Уверенность:</b> ${r.confidence}</div><p>${r.why.join(' ')}</p><div class="muted">Recommendation gate: ${r.gate.ok?'PASS':'LOCK'}${r.gate.missing?.length?' · '+r.gate.missing.join(', '):''}</div><div class="muted">Триггер: ${r.trigger}</div>${valuationBlock(t)}${riskBlock(t)}${analysisSummary(t,r)}</div>`}).join('')}
(async()=>{render();let qok=0,full=0,vfull=0,hfull=0,pfull=0;const peerTickers=[...new Set(T.flatMap(t=>window.InvestorRadarPeerUniverse.validate(t).peers))];for(const pt of peerTickers){try{PEERPRICES[pt]=await peerQuote(pt)}catch(e){}}
for(const t of T){try{const yc=await yearEndCandles(t);AUTOPE[t]=window.InvestorRadarMultiplesFactory.historicalPE({candles:yc,epsSeries:epsSeries(t),priceSource:'MOEX ISS',epsSource:sourceOf(t)});if(AUTOPE[t].verified)hfull++}catch(e){AUTOPE[t]={status:'LOCK',verified:false,historicalPE:[],missing:['factory_error']}}
const u=window.InvestorRadarPeerUniverse.validate(t);PEERPE[t]=window.InvestorRadarPeerPEFactory.build(u,window.InvestorRadarPeerEarnings,PEERPRICES);if(PEERPE[t].verified)pfull++;
VAL[t]=window.InvestorRadarValuation.assess(valuationInput(t));if(VAL[t]?.verified)vfull++;
try{let q=await quoteAndLiquidity(t);P[t]=Number(q.price);LIQ[t]={verified:Number.isFinite(q.turnoverRub)&&Number.isFinite(q.numTrades),turnoverRub:q.turnoverRub,numTrades:q.numTrades};qok++}catch(e){P[t]=NaN;LIQ[t]={verified:false}}
try{let cs=await candles(t),ir=window.InvestorRadarIssuerRisk.get(t),sr=window.InvestorRadarSanctions.get(t);RISK[t]=window.InvestorRadarRisk.assess(cs,LIQ[t],ir.issuer,{verified:sr.verified,material:sr.material,designated:sr.designated,level:sr.level,status:sr.status,items:sr.items});if(RISK[t].verified)full++}catch(e){RISK[t]=window.InvestorRadarRisk.assess([],LIQ[t],{verified:false},{verified:false})}render()}
$('#gate').textContent=`MOEX quotes: ${qok}/${T.length}. Historical P/E PASS: ${hfull}/${T.length}. Peer P/E PASS: ${pfull}/${T.length}. Full risk gate: ${full}/${T.length}. Verified valuation: ${vfull}/${T.length}. Peer EPS registry остаётся LOCK без подтверждённых source/asOf.`;render()})()
</script></body></html>
