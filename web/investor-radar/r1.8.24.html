<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Investor Radar R1.8.24 — SBER</title><style>body{margin:0;background:#071019;color:#e9f0f6;font:14px system-ui}.wrap{padding:20px;max-width:1400px;margin:auto}.card{background:#0f1b27;border:1px solid #223445;border-radius:12px;padding:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{background:#0b1520;border:1px solid #223445;border-radius:8px;padding:12px}.k{color:#8ca0b3;font-size:12px}.v{font-size:20px;font-weight:800;margin-top:4px}.gray{color:#8ca0b3}.yellow{color:#f2cc42}.green{color:#21d07a}.red{color:#ff5a5f}.pill{display:inline-block;padding:5px 9px;border:1px solid #33495d;border-radius:999px}.blockers{margin-top:14px;padding:12px;border-left:3px solid #f2cc42;background:#0b1520}.small{font-size:12px;color:#8ca0b3}.row{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px solid #182737}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>Investor Radar R1.8.24 · SBER</h1><p class="small">Цена → P/E → P/B → качество банка → equity/share basis → итоговая оценка → допустимость рекомендации</p><div class="card"><div id="status" class="pill gray">Загрузка MOEX…</div><div id="grid" class="grid" style="margin-top:14px"></div><div id="details" style="margin-top:14px"></div><div id="blockers" class="blockers"></div></div></div>
<script src="./sber-valuation-registry.js"></script><script src="./multiples-data-factory.js"></script><script src="./peer-universe-registry.js"></script><script src="./peer-earnings-registry.js"></script><script src="./peer-pe-data-factory.js"></script><script src="./sber-moex-runtime.js"></script><script src="./sber-valuation-runtime-integration.js"></script><script src="./bank-quality-trend.js"></script><script src="./bank-valuation-gate.js"></script><script src="./sber-equity-attribution-gate.js"></script><script src="./sber-valuation-completeness-gate.js"></script><script src="./sber-final-valuation-pipeline.js"></script><script>
const $=s=>document.querySelector(s);const rub=x=>Number.isFinite(x)?x.toLocaleString('ru-RU',{maximumFractionDigits:2})+' ₽':'—';
function metric(k,v,c=''){return `<div class="metric"><div class="k">${k}</div><div class="v ${c}">${v}</div></div>`}
function row(k,v){return `<div class="row"><span>${k}</span><b>${v}</b></div>`}
async function currentSber(){const u='https://iss.moex.com/iss/engines/stock/markets/shares/securities/SBER.json?iss.meta=off&iss.only=marketdata&marketdata.columns=SECID,LAST,LCURRENTPRICE,UPDATETIME';const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json(),a=d.marketdata?.data?.find(x=>x[0]==='SBER')||d.marketdata?.data?.[0];const p=Number(a?.[1]??a?.[2]);if(!Number.isFinite(p)||p<=0)throw new Error('нет цены');return {price:p,time:a?.[3]||null}}
(async()=>{let quote=null;try{quote=await currentSber()}catch(e){}
let runtime;try{runtime=await InvestorRadarSberMoexRuntime.collect(fetch)}catch(e){runtime={status:'PARTIAL',verified:false,historical:[],peers:{},asOf:new Date().toISOString()}}
const pe=InvestorRadarSberValuationRuntimeIntegration.build({registry:InvestorRadarSberValuation,runtime,multiplesFactory:InvestorRadarMultiplesFactory,peerUniverse:InvestorRadarPeerUniverse,peerEarnings:InvestorRadarPeerEarnings,peerPEFactory:InvestorRadarPeerPEFactory});
const quality=InvestorRadarBankQualityTrend.assess(InvestorRadarSberValuation.SBER.bankMetrics);
const equity=InvestorRadarSberEquityAttribution.unresolved();
const bank=InvestorRadarBankValuation.assess({verified:false,price:quote?.price,bookValuePerShare:null,roe:22.7,cet1:12.3,npl:4.9,costOfRisk:1.30,source:'MOEX issuer financials / Sber disclosure',asOf:'2025-12-31'});
const final=InvestorRadarSberFinalValuationPipeline.build({completenessGate:InvestorRadarSberValuationCompleteness,price:quote?.price,priceVerified:!!quote,peRuntime:pe,bankValuation:bank,bankQuality:quality,equityAttribution:equity});
$('#status').className='pill '+(final.verified?'green':'gray');$('#status').textContent=(final.verified?'VERIFIED':'PARTIAL')+' · '+final.action+' · '+final.confidence;
$('#grid').innerHTML=metric('Текущая цена',rub(final.currentPrice),final.currentPrice?'green':'gray')+metric('P/E runtime',pe.status,pe.verified?'green':'yellow')+metric('P/B gate',bank.status,bank.verified?'green':'gray')+metric('Bank quality',quality.traffic||'GRAY',quality.traffic==='YELLOW'?'yellow':quality.traffic==='GREEN'?'green':'gray')+metric('Equity/share basis',equity.status,equity.verified?'green':'gray')+metric('Итоговая оценка',final.valuation,final.verified?'green':'gray')+metric('Рекомендация',final.action,final.verified?'green':'gray')+metric('Светофор',final.traffic,final.traffic==='YELLOW'?'yellow':final.traffic==='GREEN'?'green':final.traffic==='RED'?'red':'gray');
const hp=pe.historical?.historicalPE||[],pp=pe.peers?.peerPE||[];$('#details').innerHTML=row('Historical P/E observations',hp.length)+row('Peer P/E observations',pp.length)+row('ROE 2025','22,7%')+row('CET1 2025','12,3%')+row('NPL 2025','4,9%')+row('Cost of Risk 2025','1,30%')+row('MOEX runtime',runtime.status)+row('Последнее обновление цены',quote?.time||'—');
$('#blockers').innerHTML=`<b>Блокирующие данные</b><div style="margin-top:6px">${final.blockers.length?final.blockers.join(' · '):'Нет'}</div><div class="small" style="margin-top:8px">${final.message}. Пока common equity/share basis и P/B не подтверждены первичным источником, карточка не имеет права классифицировать SBER как «дешёвый / справедливый / дорогой» и выдавать активную рекомендацию.</div>`;
})().catch(e=>{$('#status').textContent='LOCK · ошибка расчёта';$('#blockers').textContent='Недостаточно данных для обоснованного вывода: '+e.message})
</script></body></html>
