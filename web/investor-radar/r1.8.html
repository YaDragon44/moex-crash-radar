<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Investor Radar R1.8.1</title><style>body{margin:0;background:#071019;color:#e9f0f6;font:14px system-ui}.wrap{padding:20px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#0f1b27;border:1px solid #223445;border-radius:10px;padding:14px}.ticker{font-size:20px;font-weight:800}.pill{display:inline-block;margin:8px 0;padding:4px 8px;border:1px solid #33495d;border-radius:999px}.muted{color:#8ca0b3;font-size:12px}.green{color:#21d07a}.yellow{color:#f2cc42}.red{color:#ff5a5f}.gray{color:#8ca0b3}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>Investor Radar R1.8.1</h1><p class="muted">Recommendation Engine UI Integration · FACT ≠ ANALYSIS ≠ DECISION</p><div id="gate" class="muted">Загрузка MOEX…</div><div id="cards" class="grid"></div></div><script src="./recommendation-engine.js"></script><script>
const T=['SBER','YDEX','X5','MOEX'];
const F={YDEX:{series:[[2023,77.4],[2024,100.9],[2025,141.4]],eps:[[2024,84.1],[2025,117.8]],source:'Yandex IR'},X5:{series:[[2023,78.1],[2024,91.3],[2025,94.8]],source:'X5 IR'},MOEX:{series:[[2022,36.2911],[2023,60.7695],[2024,79.2476]],eps:[[2022,16.1],[2023,26.9],[2024,35]],source:'MOEX Annual Report 2024'}};
const $=s=>document.querySelector(s),P={};
function cagr(a,b,y){return a>0&&b>0&&y>0?(Math.pow(b/a,1/y)-1)*100:null}
function fg(t){let s=F[t]?.series;if(!s||s.length<3)return null;return cagr(s[0][1],s.at(-1)[1],s.at(-1)[0]-s[0][0])}
function eps(t){return F[t]?.eps?.at(-1)?.[1]??null}
async function quote(t){let u=`https://iss.moex.com/iss/engines/stock/markets/shares/boards/TQBR/securities/${t}.json?iss.meta=off&iss.only=marketdata&marketdata.columns=SECID,LAST,LCURRENTPRICE,UPDATETIME`,r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);let d=await r.json(),a=d.marketdata?.data?.[0];if(!a)throw new Error('нет marketdata');return a[1]??a[2]}
function valuation(t){let e=eps(t);if(!Number.isFinite(e))return {status:'LOCK'};let requiredReturn=19,modelPE=100/requiredReturn;return {status:'PROVISIONAL',low:e*modelPE*.85,high:e*modelPE*1.15}}
function input(t){return {ticker:t,price:P[t],fundamental:{verified:!!F[t],growthCagr:fg(t)},valuation:valuation(t),risk:{verified:false,critical:false,items:['Risk layer ещё не верифицирован для R1.8.1 UI gate']},facts:F[t]?[`Фундаментальный ряд подтверждён: ${F[t].source}`]:[],trigger:'Верификация risk layer и изменение фундаментала/оценки.'}}
function cls(light){return light==='ЗЕЛЁНЫЙ'?'green':light==='ЖЁЛТЫЙ'?'yellow':light==='КРАСНЫЙ'?'red':'gray'}
function render(){const E=window.InvestorRadarRecommendation;$('#cards').innerHTML=T.map(t=>{let r=E.decide(input(t));return `<div class="card" data-ticker="${t}"><div class="ticker">${t}</div><div class="pill ${cls(r.light)}">${r.light} · ${r.action}</div><div><b>Цена:</b> ${Number.isFinite(P[t])?P[t].toLocaleString('ru-RU')+' ₽':'—'}</div><div><b>Оценка:</b> ${r.valuation}</div><div><b>Уверенность:</b> ${r.confidence}</div><p>${r.why.join(' ')}</p><div class="muted">Gate: ${r.gate.ok?'PASS':'LOCK'}${r.gate.missing?.length?' · '+r.gate.missing.join(', '):''}</div><div class="muted">Триггер: ${r.trigger}</div></div>`}).join('')}
(async()=>{render();let ok=0;for(const t of T){try{P[t]=await quote(t);ok++}catch(e){P[t]=NaN}}$('#gate').textContent=`MOEX live: ${ok}/${T.length}. Активные рекомендации заблокированы до verified risk layer.`;render()})()
</script></body></html>
