<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Investor Radar R1.8.7</title><style>body{margin:0;background:#071019;color:#e9f0f6;font:14px system-ui}.wrap{padding:20px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#0f1b27;border:1px solid #223445;border-radius:10px;padding:14px}.ticker{font-size:20px;font-weight:800}.pill{display:inline-block;margin:8px 0;padding:4px 8px;border:1px solid #33495d;border-radius:999px}.muted{color:#8ca0b3;font-size:12px}.green{color:#21d07a}.yellow{color:#f2cc42}.red{color:#ff5a5f}.gray{color:#8ca0b3}.risk,.valuation{margin-top:10px;padding-top:10px;border-top:1px solid #223445}.metric{display:flex;justify-content:space-between;gap:8px}.gate{margin:10px 0 16px;padding:10px 12px;background:#0f1b27;border-left:3px solid #f2cc42;border-radius:6px}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>Investor Radar R1.8.7</h1><p class="muted">Recommendation Engine + Full Risk Gate + Hardened Valuation Gate · FACT ≠ ANALYSIS ≠ DECISION</p><div id="gate" class="gate">Загрузка MOEX…</div><div id="cards" class="grid"></div></div><script src="./recommendation-engine.js"></script><script src="./risk-layer.js"></script><script src="./issuer-risk-registry.js"></script><script src="./sanctions-regulatory-registry.js"></script><script src="./valuation-engine.js"></script><script>
const T=['SBER','YDEX','X5','MOEX'];
const F={YDEX:{series:[[2023,77.4],[2024,100.9],[2025,141.4]],eps:[[2024,84.1],[2025,117.8]],source:'Yandex IR'},X5:{series:[[2023,78.1],[2024,91.3],[2025,94.8]],source:'X5 IR'},MOEX:{series:[[2022,36.2911],[2023,60.7695],[2024,79.2476]],eps:[[2022,16.1],[2023,26.9],[2024,35]],source:'MOEX Annual Report 2024'}};
const VINPUT={YDEX:{eps:117.8,epsVerified:true,historicalPE:[],peerPE:[],source:'Yandex IR FY2025',asOf:'2025-12-31'},MOEX:{eps:35,epsVerified:true,historicalPE:[],peerPE:[],source:'MOEX Annual Report 2024',asOf:'2024-12-31'},X5:{epsVerified:false,historicalPE:[],peerPE:[],source:'X5 official reporting',asOf:'2026-06-30'},SBER:{epsVerified:false,historicalPE:[],peerPE:[],source:null,asOf:null}};
const $=s=>document.querySelector(s),P={},RISK={},LIQ={},VAL={};
function cagr(a,b,y){return a>0&&b>0&&y>0?(Math.pow(b/a,1/y)-1)*100:null}
function fg(t){let s=F[t]?.series;if(!s||s.length<3)return null;return cagr(s[0][1],s.at(-1)[1],s.at(-1)[0]-s[0][0])}
async function quoteAndLiquidity(t){let u=`https://iss.moex.com/iss/engines/stock/markets/shares/boards/TQBR/securities/${t}.json?iss.meta=off&iss.only=marketdata&marketdata.columns=SECID,LAST,LCURRENTPRICE,UPDATETIME,VALTODAY,NUMTRADES`,r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);let d=await r.json(),a=d.marketdata?.data?.[0];if(!a)throw new Error('нет marketdata');return {price:a[1]??a[2],time:a[3],turnoverRub:Number(a[4]),numTrades:Number(a[5])}}
async function candles(t){let from=new Date();from.setFullYear(from.getFullYear()-1);let u=`https://iss.moex.com/iss/engines/stock/markets/shares/securities/${t}/candles.json?iss.meta=off&interval=24&from=${from.toISOString().slice(0,10)}&candles.columns=begin,close`,r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);let d=await r.json();return(d.candles?.data||[]).map(x=>({date:x[0],close:+x[1]})).filter(x=>x.close>0)}
function valuation(t){return VAL[t]||window.InvestorRadarValuation.assess(VINPUT[t]||{})}
function input(t){let rr=RISK[t],v=valuation(t);return {ticker:t,price:P[t],fundamental:{verified:!!F[t],growthCagr:fg(t)},valuation:v,risk:{verified:rr?.verified===true,critical:rr?.critical===true,thesisBroken:rr?.thesisBroken===true,score:rr?.score,items:rr?.items||['Risk layer не рассчитан'],sanctions:rr?.sanctions||{verified:false,level:'UNKNOWN'}},portfolio:{held:false},facts:F[t]?[`Фундаментальный ряд подтверждён: ${F[t].source}`]:[],trigger:'Изменение фундаментала/оценки или прохождение всех verification gates.'}}
function cls(light){return light==='ЗЕЛЁНЫЙ'?'green':light==='ЖЁЛТЫЙ'?'yellow':light==='КРАСНЫЙ'?'red':'gray'}
function rub(x){return Number.isFinite(x)?x.toLocaleString('ru-RU',{maximumFractionDigits:0})+' ₽':'—'}
function valuationBlock(t){let v=valuation(t);return `<div class="valuation"><div class="metric"><span class="muted">Valuation gate</span><b class="${v.verified?'green':'gray'}">${v.status}</b></div><div class="metric"><span>Historical P/E median</span><span>${Number.isFinite(v.historicalMedianPE)?v.historicalMedianPE.toFixed(1):'LOCK'}</span></div><div class="metric"><span>Peer P/E median</span><span>${Number.isFinite(v.peerMedianPE)?v.peerMedianPE.toFixed(1):'LOCK'}</span></div><div class="metric"><span>Fair-value band</span><span>${Number.isFinite(v.low)&&Number.isFinite(v.high)?rub(v.low)+' – '+rub(v.high):'LOCK'}</span></div><div class="muted">${v.verified?v.method:'Missing: '+(v.missing||[]).join(', ')}</div></div>`}
function riskBlock(t){let r=RISK[t];if(!r)return '<div class="risk muted">Risk layer: загрузка…</div>';let v=r.metrics?.annualizedVolatility,m=r.metrics?.maxDrawdown,turn=r.metrics?.turnoverRub,trades=r.metrics?.numTrades;return `<div class="risk"><div class="metric"><span class="muted">Full risk gate</span><b class="${r.verified?'green':r.status==='PARTIAL'?'yellow':'gray'}">${r.status}</b></div><div class="metric"><span>Market</span><span>${r.marketVerified?'PASS':'LOCK'}</span></div><div class="metric"><span>Liquidity</span><span>${r.liquidityVerified?'PASS':'LOCK'}</span></div><div class="metric"><span>Issuer</span><span>${r.issuerVerified?'PASS':'LOCK'}</span></div><div class="metric"><span>Sanctions/regulatory</span><span>${r.regulatoryVerified?'PASS':'LOCK'}</span></div><div class="metric"><span>Sanctions level</span><span>${r.sanctions?.level||'UNKNOWN'}</span></div><div class="metric"><span>Volatility</span><span>${Number.isFinite(v)?v.toFixed(1)+'%':'—'}</span></div><div class="metric"><span>Max drawdown</span><span>${Number.isFinite(m)?m.toFixed(1)+'%':'—'}</span></div><div class="metric"><span>Turnover today</span><span>${rub(turn)}</span></div><div class="metric"><span>Trades today</span><span>${Number.isFinite(trades)?trades.toLocaleString('ru-RU'):'—'}</span></div><div class="metric"><span>Risk score</span><span>${Number.isFinite(r.score)?r.score.toFixed(1)+'/100':'LOCK'}</span></div><div class="muted">${r.gateReason}</div></div>`}
function render(){const E=window.InvestorRadarRecommendation;$('#cards').innerHTML=T.map(t=>{let r=E.decide(input(t));return `<div class="card" data-ticker="${t}"><div class="ticker">${t}</div><div class="pill ${cls(r.light)}">${r.light} · ${r.action}</div><div><b>Цена:</b> ${Number.isFinite(P[t])?P[t].toLocaleString('ru-RU')+' ₽':'—'}</div><div><b>Оценка:</b> ${r.valuation}</div><div><b>Уверенность:</b> ${r.confidence}</div><p>${r.why.join(' ')}</p><div class="muted">Recommendation gate: ${r.gate.ok?'PASS':'LOCK'}${r.gate.missing?.length?' · '+r.gate.missing.join(', '):''}</div><div class="muted">Триггер: ${r.trigger}</div>${valuationBlock(t)}${riskBlock(t)}</div>`}).join('')}
(async()=>{for(const t of T)VAL[t]=window.InvestorRadarValuation.assess(VINPUT[t]||{});render();let qok=0,full=0,vfull=0;for(const t of T){if(VAL[t]?.verified)vfull++;try{let q=await quoteAndLiquidity(t);P[t]=Number(q.price);LIQ[t]={verified:Number.isFinite(q.turnoverRub)&&Number.isFinite(q.numTrades),turnoverRub:q.turnoverRub,numTrades:q.numTrades};qok++}catch(e){P[t]=NaN;LIQ[t]={verified:false}}try{let cs=await candles(t),ir=window.InvestorRadarIssuerRisk.get(t),sr=window.InvestorRadarSanctions.get(t);RISK[t]=window.InvestorRadarRisk.assess(cs,LIQ[t],ir.issuer,{verified:sr.verified,critical:sr.critical,level:sr.level,status:sr.status,items:sr.items});if(RISK[t].verified)full++}catch(e){RISK[t]=window.InvestorRadarRisk.assess([],LIQ[t],{verified:false},{verified:false})}render()}$('#gate').textContent=`MOEX quotes: ${qok}/${T.length}. Full risk gate: ${full}/${T.length}. Verified valuation: ${vfull}/${T.length}. Активная рекомендация требует оба PASS.`;render()})()
</script></body></html>
