<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Аренда Москва — Apartment Radar</title>
<style>
:root{--bg:#08110f;--panel:#101a17;--panel2:#14211d;--text:#f4f7f5;--muted:#94a39d;--green:#39e58c;--yellow:#ffd166;--red:#ff5d6c;--cyan:#64d9ff;--violet:#b79cff;--line:#22332d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% -10%,#123528 0,transparent 27%),linear-gradient(135deg,#07100e,#0b1512 55%,#07100e);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.wrap{max-width:1920px;margin:auto;padding:24px}.top{display:grid;grid-template-columns:1.45fr repeat(5,minmax(150px,.55fr));gap:12px;align-items:stretch}.brand,.kpi,.card,.box{background:rgba(16,26,23,.86);border:1px solid var(--line);border-radius:20px;box-shadow:0 16px 50px rgba(0,0,0,.18)}.brand{padding:20px 24px}.eyebrow{font-size:12px;letter-spacing:.18em;color:var(--green);font-weight:800}.brand h1{margin:4px 0 2px;font-size:31px}.sub{color:var(--muted);font-size:14px}.updated{margin-top:10px;font-size:12px;color:#c4d0cc}.kpi{padding:16px}.kpi .v{font-size:27px;font-weight:900;margin-top:7px}.kpi .l{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.08em}.diamond .v{color:var(--violet);font-size:19px}.section-title{display:flex;align-items:center;justify-content:space-between;margin:22px 2px 10px}.section-title h2{margin:0;font-size:20px}.section-title span{color:var(--muted);font-size:12px}.grid-main{display:grid;grid-template-columns:1.35fr .825fr .825fr;gap:14px}.card{padding:20px;position:relative;overflow:hidden}.card.primary{border-color:#2d624b;background:linear-gradient(160deg,rgba(18,47,36,.95),rgba(13,25,21,.95))}.rank{font-size:16px;font-weight:900}.address{font-size:23px;font-weight:900;margin-top:6px}.primary .address{font-size:30px}.price-row{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:16px 0}.price{font-size:35px;font-weight:950}.primary .price{font-size:46px}.area{color:var(--muted);font-weight:700}.score{font-size:42px;font-weight:950;line-height:.9;text-align:right}.score small{font-size:13px;color:var(--muted);display:block;margin-top:8px}.primary .score{font-size:62px;color:var(--green)}.badges{display:flex;gap:7px;flex-wrap:wrap}.badge{padding:7px 10px;border-radius:999px;font-size:11px;font-weight:900;background:#1a2b25;border:1px solid #29483d}.green{color:var(--green)}.yellow{color:var(--yellow)}.red{color:var(--red)}.violet{color:var(--violet)}.cyan{color:var(--cyan)}.transport{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:15px 0}.transport div,.req div,.money div{background:rgba(255,255,255,.03);padding:10px;border-radius:12px}.transport b,.money b{display:block;font-size:14px}.transport span,.money span{font-size:11px;color:var(--muted)}.req{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:13px 0}.req div{font-size:12px;font-weight:750}.money{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:13px 0}.signal{display:grid;grid-template-columns:1fr 1fr;gap:8px}.signal div{padding:11px;border-radius:12px;background:#0c1714}.signal strong{display:block;font-size:10px;color:var(--muted);margin-bottom:5px}.signal p{margin:0;font-size:12px;font-weight:700;line-height:1.35}.risk{border:1px solid rgba(255,209,102,.22)}.plus{border:1px solid rgba(57,229,140,.2)}.btn{display:inline-block;margin-top:14px;padding:11px 14px;border-radius:12px;background:var(--green);color:#06110d;text-decoration:none;font-size:12px;font-weight:950}.btn.disabled{background:#25332e;color:#87968f;pointer-events:none}.bottom{display:grid;grid-template-columns:1.1fr 1fr 1fr 1.3fr;gap:14px;margin-top:14px}.box{padding:16px;min-height:150px}.box h3{font-size:13px;margin:0 0 12px}.diamond-box{border-color:#4a3d6a;background:linear-gradient(150deg,#171329,#101a17)}.diamond-big{font-size:22px;font-weight:950;color:var(--violet)}.change,.watch{font-size:12px;line-height:1.85;color:#dbe5e1}.choice{border-color:#2b674c}.choice .pick{font-size:19px;font-weight:950}.questions{margin:8px 0 0;padding-left:18px;font-size:11px;line-height:1.55;color:#b8c4bf}.missing{color:var(--yellow)}@media(max-width:1200px){.top{grid-template-columns:1fr 1fr 1fr}.brand{grid-column:1/-1}.grid-main{grid-template-columns:1fr}.bottom{grid-template-columns:1fr 1fr}}@media(max-width:700px){.top,.bottom{grid-template-columns:1fr}.wrap{padding:12px}.money,.signal{grid-template-columns:1fr}.primary .price{font-size:36px}.primary .address{font-size:24px}}
</style>
</head>
<body>
<div class="wrap" id="app">Загрузка…</div>
<script>
const fmt=n=>n==null?'⚠️ требует подтверждения':new Intl.NumberFormat('ru-RU').format(n)+' ₽';
const reqLabel={confirmed:'🟢',unknown:'🟡',missing:'🔴'};
const categoryClass=s=>s==='BEST VALUE'||s==='HOT'?'green':s==='GOOD'?'cyan':s==='WATCH'?'yellow':'red';
function card(a,i){const link=a.listing_url?`<a class="btn" href="${a.listing_url}" target="_blank" rel="noopener">СМОТРЕТЬ ОБЪЯВЛЕНИЕ →</a>`:`<span class="btn disabled">⚠️ ПРЯМАЯ ССЫЛКА НЕ ПОДТВЕРЖДЕНА</span>`;return `<article class="card ${i===0?'primary':''}"><div class="rank">${a.rank===1?'🥇':a.rank===2?'🥈':'🥉'} ${a.rank===1?'№1 — ЛИДЕР':'ВАРИАНТ №'+a.rank}</div><div class="address">${a.address}</div><div class="price-row"><div><div class="price">${fmt(a.rent)}</div><div class="area">${a.area??'⚠️'} м² · ${a.rooms||'⚠️ требует подтверждения'}</div></div><div class="score">${a.value_score??'—'}<small>VALUE /100</small></div></div><div class="badges"><span class="badge ${categoryClass(a.category)}">${a.category||'WATCH'}</span><span class="badge ${a.traffic_light==='green'?'green':a.traffic_light==='red'?'red':'yellow'}">${a.traffic_light==='green'?'🟢 РЕКОМЕНДУЕМ':a.traffic_light==='red'?'🔴 НЕ ПОДХОДИТ':'🟡 ТРЕБУЕТ ПРОВЕРКИ'}</span>${a.direct_green?'<span class="badge green">🟢 ПРЯМАЯ ЗЕЛЁНАЯ</span>':''}</div><div class="transport"><div><span>🚇 МЕТРО / ПЕШКОМ</span><b>${a.metro||'⚠️'} · ${a.walk_minutes==null?'⚠️':a.walk_minutes+' мин'}</b></div><div><span>🏢 ДО ПАВЕЛЕЦКОЙ</span><b>${a.total_paveletskaya_minutes==null?'⚠️ требует подтверждения':'~'+a.total_paveletskaya_minutes+' мин'}</b></div></div><div class="req"><div>❄️ Кондиционер ${reqLabel[a.air_conditioner]||'🟡'}</div><div>🧺 Стиральная ${reqLabel[a.washing_machine]||'🟡'}</div><div>🍽 Посудомойка ${reqLabel[a.dishwasher]||'🟡'}</div><div>🛏 Кровать ${reqLabel[a.double_bed]||'🟡'}</div></div><div class="money"><div><span>АРЕНДА</span><b>${fmt(a.rent)}</b></div><div><span>ПОЛНАЯ / МЕС.</span><b>${fmt(a.monthly_total)}</b></div><div><span>ВЪЕЗД</span><b>${fmt(a.move_in_cost)}</b></div></div><div class="signal"><div class="plus"><strong>ГЛАВНЫЙ ПЛЮС</strong><p>${a.main_plus||'⚠️ требует подтверждения'}</p></div><div class="risk"><strong>ГЛАВНЫЙ РИСК</strong><p>${a.main_risk||'⚠️ требует подтверждения'}</p></div></div>${link}</article>`}
fetch('./data/apartments.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{const rec=d.recommended||[];const avg=rec.length?Math.round(rec.reduce((s,x)=>s+(x.rent||0),0)/rec.length):null;const best=rec[0];document.getElementById('app').innerHTML=`<div class="top"><section class="brand"><div class="eyebrow">АРЕНДА МОСКВА</div><h1>Лучшие квартиры для поездок на Павелецкую</h1><div class="sub">Decision dashboard · только переданные аналитические данные</div><div class="updated">Обновлено: ${d.updated_at||'⚠️ требует подтверждения'}</div></section><div class="kpi"><div class="l">АКТИВНЫХ</div><div class="v">${d.kpi?.active??'—'}</div></div><div class="kpi"><div class="l">РЕКОМЕНДОВАННЫХ</div><div class="v">${rec.length}</div></div><div class="kpi"><div class="l">СРЕДНЯЯ ЦЕНА</div><div class="v">${avg?Math.round(avg/1000)+'K':'—'}</div></div><div class="kpi"><div class="l">BEST VALUE</div><div class="v green">${best?.value_score??'—'}</div></div><div class="kpi diamond"><div class="l">💎 БРИЛЛИАНТ</div><div class="v">${d.diamond_found?'НАЙДЕН':'ИЩЕМ'}</div></div></div><div class="section-title"><h2>🏆 РЕКОМЕНДОВАННЫЕ</h2><span>сильнейшие варианты, прошедшие обязательные требования</span></div><div class="grid-main">${rec.slice(0,3).map(card).join('')}</div><div class="bottom"><section class="box diamond-box"><h3>💎 БРИЛЛИАНТ МОСКВЫ</h3><div class="diamond-big">${d.diamond_found?'💎 БРИЛЛИАНТ НАЙДЕН':'💎 БРИЛЛИАНТ ПОКА НЕ НАЙДЕН'}</div><div class="sub" style="margin-top:8px">${d.diamond_found?(d.diamond_note||''): 'Продолжаем искать аномально сильное предложение по всей Москве.'}</div></section><section class="box"><h3>ИЗМЕНЕНИЯ С ПРОШЛОЙ ПРОВЕРКИ</h3><div class="change">${(d.changes||['⚠️ История пока не подключена']).map(x=>'• '+x).join('<br>')}</div></section><section class="box"><h3>WATCH LIST</h3><div class="watch">${(d.watch_list||[]).length?d.watch_list.map(x=>`${x.status_icon||'🟢'} ${x.address}<br>${fmt(x.current_price)} · было ${fmt(x.previous_price)}`).join('<br><br>'):'⚠️ Пока пусто'}</div></section><section class="box choice"><h3>МОЙ ВЫБОР СЕГОДНЯ</h3><div class="pick">🥇 ${best?.address||'⚠️ требует подтверждения'}</div><div class="score green" style="text-align:left;font-size:37px;margin-top:7px">${best?.value_score??'—'}<small>VALUE /100</small></div><div class="sub">${d.my_choice_reason||'⚠️ требует подтверждения'}</div><ul class="questions">${(d.call_questions||[]).slice(0,5).map(q=>'<li>'+q+'</li>').join('')}</ul></section></div>`}).catch(()=>document.getElementById('app').innerHTML='<div class="box"><h2>Не удалось загрузить данные</h2><p class="missing">Проверьте data/apartments.json</p></div>');
</script>
</body></html>
