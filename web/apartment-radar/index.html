<!doctype html>
<html lang="ru"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Аренда Москва — Apartment Radar</title><style>
:root{--panel:#101a17;--text:#f4f7f5;--muted:#94a39d;--green:#39e58c;--yellow:#ffd166;--red:#ff5d6c;--cyan:#64d9ff;--orange:#ff9f43;--violet:#b79cff;--line:#22332d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% -10%,#123528 0,transparent 27%),linear-gradient(135deg,#07100e,#0b1512 55%,#07100e);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.wrap{max-width:1920px;margin:auto;padding:20px}.top{display:grid;grid-template-columns:1.45fr repeat(5,minmax(150px,.55fr));gap:10px}.brand,.kpi,.card,.box{background:rgba(16,26,23,.86);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 38px rgba(0,0,0,.16)}.brand{padding:16px 20px}.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--green);font-weight:800}.brand h1{margin:3px 0 2px;font-size:27px}.sub{color:var(--muted);font-size:12px}.updated{margin-top:7px;font-size:11px;color:#c4d0cc}.kpi{padding:13px}.kpi .v{font-size:23px;font-weight:900;margin-top:5px}.kpi .l{font-size:10px;color:var(--muted);font-weight:800;letter-spacing:.08em}.diamond .v{color:var(--violet);font-size:17px}.section-title{display:flex;align-items:center;justify-content:space-between;margin:16px 2px 8px}.section-title h2{margin:0;font-size:18px}.section-title span{color:var(--muted);font-size:11px}.grid-main{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;align-items:stretch}.card{padding:14px;min-width:0;min-height:490px;height:100%;display:flex;flex-direction:column;overflow:hidden}.card.primary{border-color:#2d624b;background:linear-gradient(160deg,rgba(18,47,36,.95),rgba(13,25,21,.95))}.card.favorite{border-color:#9b5d24;background:linear-gradient(160deg,rgba(67,42,20,.98),rgba(27,25,20,.96));box-shadow:0 12px 38px rgba(255,159,67,.12)}.favorite .rank,.favorite .score{color:var(--orange)}.rank{font-size:13px;font-weight:900}.address{font-size:19px;font-weight:900;margin-top:4px;min-height:47px}.price-row{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:9px 0}.price{font-size:29px;font-weight:950}.area{color:var(--muted);font-size:12px;font-weight:700}.score{font-size:34px;font-weight:950;line-height:.9;text-align:right}.score small{font-size:10px;color:var(--muted);display:block;margin-top:5px}.primary .score{color:var(--green)}.badges{display:flex;gap:5px;flex-wrap:wrap;min-height:48px;align-content:flex-start}.badge{padding:5px 7px;border-radius:999px;font-size:9px;font-weight:900;background:#1a2b25;border:1px solid #29483d}.green{color:var(--green)}.yellow{color:var(--yellow)}.red{color:var(--red)}.orange{color:var(--orange)}.violet{color:var(--violet)}.cyan{color:var(--cyan)}.transport{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:9px 0}.transport div,.req div,.money div{background:rgba(255,255,255,.03);padding:7px;border-radius:9px}.transport b,.money b{display:block;font-size:12px}.transport span,.money span{font-size:9px;color:var(--muted)}.req{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:7px 0}.req div{font-size:10px;font-weight:750}.money{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin:7px 0}.signal{display:grid;grid-template-columns:1fr 1fr;gap:6px}.signal div{padding:8px;border-radius:9px;background:#0c1714;min-height:62px}.signal strong{display:block;font-size:8px;color:var(--muted);margin-bottom:3px}.signal p{margin:0;font-size:10px;font-weight:700;line-height:1.3}.risk{border:1px solid rgba(255,209,102,.22)}.plus{border:1px solid rgba(57,229,140,.2)}.btn{display:inline-block;margin-top:auto;padding:8px 10px;border-radius:9px;background:var(--green);color:#06110d;text-decoration:none;font-size:10px;font-weight:950;align-self:flex-start}.favorite .btn{background:var(--orange);color:#1b1005}.btn.disabled{background:#25332e;color:#87968f;pointer-events:none}.bottom{display:grid;grid-template-columns:1.1fr 1fr 1.3fr;gap:10px;margin-top:10px}.box{padding:13px;min-height:130px}.box h3{font-size:11px;margin:0 0 9px}.diamond-box{border-color:#4a3d6a;background:linear-gradient(150deg,#171329,#101a17)}.diamond-big{font-size:18px;font-weight:950;color:var(--violet)}.change{font-size:10px;line-height:1.7;color:#dbe5e1}.choice{border-color:#2b674c}.choice .pick{font-size:16px;font-weight:950}.questions{margin:6px 0 0;padding-left:16px;font-size:9px;line-height:1.45;color:#b8c4bf}.missing{color:var(--yellow)}@media(max-width:1500px){.grid-main{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:1200px){.top{grid-template-columns:1fr 1fr 1fr}.brand{grid-column:1/-1}.bottom{grid-template-columns:1fr 1fr}}@media(max-width:700px){.top,.bottom,.grid-main{grid-template-columns:1fr}.wrap{padding:10px}.money,.signal{grid-template-columns:1fr}.card{min-height:auto}}
</style></head><body><div class="wrap" id="app">Загрузка…</div><script>
const fmt=n=>n==null?'⚠️ требует подтверждения':new Intl.NumberFormat('ru-RU').format(n)+' ₽';const reqLabel={confirmed:'🟢',unknown:'🟡',missing:'🔴'};const categoryClass=s=>s==='BEST VALUE'||s==='HOT'?'green':s==='GOOD'?'cyan':s==='WATCH'?'yellow':'red';
function card(a,i){const link=a.listing_url?`<a class="btn" href="${a.listing_url}" target="_blank" rel="noopener">СМОТРЕТЬ ОБЪЯВЛЕНИЕ →</a>`:`<span class="btn disabled">⚠️ ПРЯМАЯ ССЫЛКА НЕ ПОДТВЕРЖДЕНА</span>`;return `<article class="card ${i===0?'primary':''}"><div class="rank">${a.rank===1?'🥇':a.rank===2?'🥈':'🥉'} ${a.rank===1?'№1 — ЛИДЕР':'ВАРИАНТ №'+a.rank}</div><div class="address">${a.address}</div><div class="price-row"><div><div class="price">${fmt(a.rent)}</div><div class="area">${a.area??'⚠️'} м² · ${a.rooms||'⚠️ требует подтверждения'}</div></div><div class="score">${a.value_score??'—'}<small>VALUE /100</small></div></div><div class="badges"><span class="badge ${categoryClass(a.category)}">${a.category||'WATCH'}</span><span class="badge ${a.traffic_light==='green'?'green':a.traffic_light==='red'?'red':'yellow'}">${a.traffic_light==='green'?'🟢 РЕКОМЕНДУЕМ':a.traffic_light==='red'?'🔴 НЕ ПОДХОДИТ':'🟡 ТРЕБУЕТ ПРОВЕРКИ'}</span>${a.direct_green?'<span class="badge green">🟢 ПРЯМАЯ ЗЕЛЁНАЯ</span>':''}</div><div class="transport"><div><span>🚇 МЕТРО / ПЕШКОМ</span><b>${a.metro||'⚠️'} · ${a.walk_minutes==null?'⚠️':a.walk_minutes+' мин'}</b></div><div><span>🏢 ДО ПАВЕЛЕЦКОЙ</span><b>${a.total_paveletskaya_minutes==null?'⚠️ требует подтверждения':'~'+a.total_paveletskaya_minutes+' мин'}</b></div></div><div class="req"><div>❄️ Кондиционер ${reqLabel[a.air_conditioner]||'🟡'}</div><div>🧺 Стиральная ${reqLabel[a.washing_machine]||'🟡'}</div><div>🍽 Посудомойка ${reqLabel[a.dishwasher]||'🟡'}</div><div>🛏 Кровать ${reqLabel[a.double_bed]||'🟡'}</div></div><div class="money"><div><span>АРЕНДА</span><b>${fmt(a.rent)}</b></div><div><span>ПОЛНАЯ / МЕС.</span><b>${fmt(a.monthly_total)}</b></div><div><span>ВЪЕЗД</span><b>${fmt(a.move_in_cost)}</b></div></div><div class="signal"><div class="plus"><strong>ГЛАВНЫЙ ПЛЮС</strong><p>${a.main_plus||'⚠️ требует подтверждения'}</p></div><div class="risk"><strong>ГЛАВНЫЙ РИСК</strong><p>${a.main_risk||'⚠️ требует подтверждения'}</p></div></div>${link}</article>`}
function favoriteCard(x){const diff=(x.previous_price!=null&&x.current_price!=null)?x.previous_price-x.current_price:null;const pct=diff!=null&&x.previous_price?Math.round(diff/x.previous_price*100):null;const link=x.listing_url?`<a class="btn" href="${x.listing_url}" target="_blank" rel="noopener">ОТКРЫТЬ ОБЪЯВЛЕНИЕ →</a>`:`<span class="btn disabled">⚠️ ПРЯМАЯ ССЫЛКА НЕ ПОДТВЕРЖДЕНА</span>`;return `<article class="card favorite"><div class="rank">⭐ ИЗБРАННОЕ / СЛЕДИМ</div><div class="address">${x.address||'⚠️ требует подтверждения'}</div><div class="price-row"><div><div class="price">${fmt(x.current_price)}</div><div class="area">было ${fmt(x.previous_price)}</div></div><div class="score">${diff>0?'↓':''}${pct!=null?pct+'%':'—'}<small>ИЗМЕНЕНИЕ ЦЕНЫ</small></div></div><div class="badges"><span class="badge orange">⭐ ИЗБРАННОЕ</span><span class="badge green">${x.status_icon||'•'} ЦЕНА СНИЗИЛАСЬ</span><span class="badge yellow">⚠️ ПАРАМЕТРЫ НА ПРОВЕРКЕ</span></div><div class="transport"><div><span>🚇 МЕТРО / ПЕШКОМ</span><b>⚠️ требует подтверждения</b></div><div><span>🏢 ДО ПАВЕЛЕЦКОЙ</span><b>⚠️ требует подтверждения</b></div></div><div class="req"><div>❄️ Кондиционер 🟡</div><div>🧺 Стиральная 🟡</div><div>🍽 Посудомойка 🟡</div><div>🛏 Кровать 🟡</div></div><div class="money"><div><span>АРЕНДА</span><b>${fmt(x.current_price)}</b></div><div><span>ПОЛНАЯ / МЕС.</span><b>⚠️</b></div><div><span>ВЪЕЗД</span><b>⚠️</b></div></div><div class="signal"><div class="plus"><strong>ПОЧЕМУ СЛЕДИМ</strong><p>Вариант добавлен в избранное и не должен теряться из поля зрения.</p></div><div class="risk"><strong>ЧТО НЕ ХВАТАЕТ</strong><p>Нужно подтвердить технику, маршрут и условия аренды.</p></div></div>${link}</article>`}
fetch('./data/apartments.json',{cache:'no-store'}).then(r=>r.json()).then(d=>{const rec=d.recommended||[];const watch=d.watch_list||[];const avg=rec.length?Math.round(rec.reduce((s,x)=>s+(x.rent||0),0)/rec.length):null;const best=rec[0];const favorite=watch[0];document.getElementById('app').innerHTML=`<div class="top"><section class="brand"><div class="eyebrow">АРЕНДА МОСКВА</div><h1>Лучшие квартиры для поездок на Павелецкую</h1><div class="sub">Decision dashboard · только переданные аналитические данные</div><div class="updated">Обновлено: ${d.updated_at||'⚠️ требует подтверждения'}</div></section><div class="kpi"><div class="l">АКТИВНЫХ</div><div class="v">${d.kpi?.active??'—'}</div></div><div class="kpi"><div class="l">РЕКОМЕНДОВАННЫХ</div><div class="v">${rec.length}</div></div><div class="kpi"><div class="l">СРЕДНЯЯ ЦЕНА</div><div class="v">${avg?Math.round(avg/1000)+'K':'—'}</div></div><div class="kpi"><div class="l">BEST VALUE</div><div class="v green">${best?.value_score??'—'}</div></div><div class="kpi diamond"><div class="l">💎 БРИЛЛИАНТ</div><div class="v">${d.diamond_found?'НАЙДЕН':'ИЩЕМ'}</div></div></div><div class="section-title"><h2>🏆 КАНДИДАТЫ</h2><span>сначала избранное, затем текущий TOP</span></div><div class="grid-main">${favorite?favoriteCard(favorite):''}${rec.slice(0,3).map(card).join('')}</div><div class="bottom"><section class="box diamond-box"><h3>💎 БРИЛЛИАНТ МОСКВЫ</h3><div class="diamond-big">${d.diamond_found?'💎 БРИЛЛИАНТ НАЙДЕН':'💎 БРИЛЛИАНТ ПОКА НЕ НАЙДЕН'}</div><div class="sub" style="margin-top:6px">${d.diamond_found?(d.diamond_note||''):'Продолжаем искать аномально сильное предложение по всей Москве.'}</div></section><section class="box"><h3>ИЗМЕНЕНИЯ С ПРОШЛОЙ ПРОВЕРКИ</h3><div class="change">${(d.changes||['⚠️ История пока не подключена']).map(x=>'• '+x).join('<br>')}</div></section><section class="box choice"><h3>МОЙ ВЫБОР СЕГОДНЯ</h3><div class="pick">🥇 ${best?.address||'⚠️ требует подтверждения'}</div><div class="score green" style="text-align:left;font-size:30px;margin-top:5px">${best?.value_score??'—'}<small>VALUE /100</small></div><div class="sub">${d.my_choice_reason||'⚠️ требует подтверждения'}</div><ul class="questions">${(d.call_questions||[]).slice(0,5).map(q=>'<li>'+q+'</li>').join('')}</ul></section></div>`}).catch(()=>document.getElementById('app').innerHTML='<div class="box"><h2>Не удалось загрузить данные</h2><p class="missing">Проверьте data/apartments.json</p></div>');
</script></body></html>
