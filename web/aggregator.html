<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IDEA RADAR · Агрегатор торговых идей</title><style>:root{color-scheme:dark;--bg:#07100f;--p:#0d1b18;--l:#203631;--t:#edf7f4;--m:#8ba59e;--v:#b978ff}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);font-family:Inter,system-ui,sans-serif;color:var(--t)}.shell{height:100%;display:grid;grid-template-rows:auto 1fr}.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:10px 18px;background:#091512;border-bottom:1px solid var(--l)}.brand{font-size:17px;font-weight:950;white-space:nowrap}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tab{appearance:none;border:1px solid var(--l);background:#0b1715;color:var(--m);padding:8px 13px;border-radius:10px;font-weight:850;cursor:pointer}.tab.active{color:#eadcff;border-color:#70439c;background:#21132e}.quality{font-size:11px;color:var(--m);white-space:nowrap}.frame{width:100%;height:100%;border:0;background:var(--bg)}@media(max-width:760px){.nav{align-items:flex-start;flex-direction:column}.quality{display:none}}</style></head><body><div class="shell"><header class="nav"><div class="brand">◎ IDEA RADAR</div><nav class="tabs" aria-label="Разделы"><button class="tab active" data-src="idea-radar/index.html">Агрегатор торговых идей</button><button class="tab" data-src="crowd-risk.html">Мониторинг рынка</button></nav><div class="quality">DATA QUALITY FIRST · N/A вместо ложной точности</div></header><iframe id="frame" class="frame" src="idea-radar/index.html" title="IDEA RADAR"></iframe></div><script>const f=document.getElementById('frame');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');f.src=b.dataset.src;});</script></body></html>
