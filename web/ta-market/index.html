<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TA Market Monitor · R0.6.2</title><style>:root{--bg:#070a0f;--card:#0d141d;--line:#223044;--tx:#f1f5fb;--m:#8b98aa;--g:#31d39b;--y:#ffc857;--r:#ff6374;--b:#6da7ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 25% -5%,#172a45 0,#070a0f 38%);color:var(--tx);font:14px Inter,system-ui,sans-serif}.wrap{max-width:1500px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:18px;align-items:flex-end}.top h1{margin:0;font-size:28px}.sub,.muted{color:var(--m)}.pill{border:1px solid var(--line);background:#0b1119;border-radius:999px;padding:8px 12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}.ticker{font-size:20px;font-weight:900}.price{font-size:30px;font-weight:900;margin:8px 0}.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid #182331}.ok{color:var(--g)}.warn{color:var(--y)}.bad{color:var(--r)}.box{margin-top:14px;background:#0b1119;border:1px solid var(--line);border-radius:14px;padding:14px}.title{font-size:11px;color:var(--m);text-transform:uppercase;letter-spacing:.08em}.big{font-size:20px;font-weight:900;margin-top:5px}button{background:#152238;color:var(--tx);border:1px solid #29405e;border-radius:10px;padding:9px 14px;cursor:pointer}@media(max-width:900px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><div class="top"><div><h1>TA Market Monitor <span class="ok">R0.6.2</span></h1><div class="sub">Live Data Validation · GitHub Actions → MOEX ISS → static JSON → browser</div></div><div><button id="refresh">Обновить</button> <span id="health" class="pill">загрузка…</span></div></div><div id="cards" class="grid"></div><div class="box"><div class="title">Gate</div><div id="gate" class="big">Проверка канала данных…</div><div id="detail" class="muted" style="margin-top:8px"></div></div></div><script>const URL='./data/current.json';const N={SBERP:'Сбербанк-п',VKCO:'ВК',OZPH:'Озон Фармацевтика'};const $=x=>document.getElementById(x);const f=(x,d=2)=>Number.isFinite(+x)?(+x).toLocaleString('ru-RU',{minimumFractionDigits:d,maximumFractionDigits:d}):'N/A';function ageMin(ts){const t=Date.parse(ts);return Number.isFinite(t)?(Date.now()-t)/60000:null}async function load(){try{const r=await fetch(URL+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();const age=ageMin(j.generated_at),fresh=age!=null&&age>=0&&age<=25,quality=j.quality||'N/A';$('health').className='pill '+(fresh&&quality!=='ERROR'?'ok':'warn');$('health').textContent=`snapshot ${fresh?'FRESH':'STALE'} · ${quality}`;$('cards').innerHTML=Object.keys(N).map(id=>{const z=j.securities?.[id],m=z?.marketdata||{},err=j.errors?.[id];const cnt=z?.raw||{};return`<div class="card"><div class="ticker">${id}</div><div class="muted">${N[id]}</div><div class="price ${err?'bad':''}">${err?'N/A':f(m.LAST)+' ₽'}</div><div class="row"><span>MOEX update</span><b>${m.UPDATETIME||m.SYSTIME||'N/A'}</b></div><div class="row"><span>D1 / H1 / M10</span><b>${cnt.D1?.length||0} / ${cnt.H1?.length||0} / ${cnt.M10?.length||0}</b></div><div class="row"><span>Status</span><b class="${err?'bad':'ok'}">${err?'ERROR':'DATA OK'}</b></div>${err?`<div class="bad" style="margin-top:8px">${err}</div>`:''}</div>`}).join('');const all=Object.keys(N).every(id=>j.securities?.[id]&&!j.errors?.[id]);const pass=all&&fresh&&j.imoex?.length;$('gate').className='big '+(pass?'ok':'warn');$('gate').textContent=pass?'LIVE DATA GATE: PASS':'LIVE DATA GATE: WAIT';$('detail').textContent=`generated_at: ${j.generated_at||'N/A'} · age: ${age==null?'N/A':f(age,1)+' мин'} · IMOEX rows: ${j.imoex?.length||0} · errors: ${Object.keys(j.errors||{}).length}. READY-логика на этой странице намеренно не запускается: сначала подтверждаем надежность канала данных.`}catch(e){$('health').className='pill bad';$('health').textContent='SNAPSHOT ERROR';$('cards').innerHTML='';$('gate').className='big bad';$('gate').textContent='LIVE DATA GATE: FAIL';$('detail').textContent=String(e.message||e)}}$('refresh').onclick=load;load();setInterval(load,60000);</script></body></html>
