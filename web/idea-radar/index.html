<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ЖУГАН · IDEA RADAR</title><style>
:root{color-scheme:dark;--bg:#07100f;--panel:#0b1715;--panel2:#0e1e1b;--line:#203631;--text:#edf7f4;--muted:#8ba59e;--good:#53e0a3;--warn:#f0c86d;--bad:#ff7a7a;--info:#77b9ff}*{box-sizing:border-box}body{margin:0;background:#07100f;color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:18px}.shell{max-width:1920px;margin:auto;padding:20px 24px 36px}a{color:#9ed3ff;text-decoration:none}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.brand{display:flex;gap:14px;align-items:center}.logo{font-size:29px;font-weight:900}.live{color:var(--good);border:1px solid #245941;border-radius:99px;padding:7px 11px;font-size:14px;font-weight:800}.meta{text-align:right;color:var(--muted);font-size:14px}.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:16px 0}.kpi,.group,.event{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px}.kpi{padding:13px 15px}.kpi b{display:block;font-size:30px}.kpi span,.label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.title{margin:20px 0 10px;font-size:16px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#a9c1ba}.title.hot{color:var(--good)}.groups{display:grid;gap:16px}.group{overflow:hidden}.group.hot{border-color:#2d6c55}.group-head{padding:16px 20px;border-bottom:1px solid #173029;display:flex;justify-content:space-between;align-items:center}.asset{font-size:30px;font-weight:900}.badge{font-size:13px;padding:6px 9px;border:1px solid #2a453e;border-radius:99px;margin-left:6px}.good{color:var(--good)}.warn{color:var(--warn)}.versions{display:grid;gap:0}.version{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(280px,.85fr);border-top:1px solid #173029}.version:first-child{border-top:0}.version.current{background:rgba(83,224,163,.035)}.copy{padding:18px 20px}.vhead{display:flex;justify-content:space-between;gap:12px;margin-bottom:12px}.vtitle{font-size:17px;font-weight:850}.current-tag{color:var(--good);font-size:12px;font-weight:900}.author{white-space:pre-wrap;font-size:19px;line-height:1.5;margin:7px 0 14px}.system{background:#0c211c;border:1px solid #21443a;border-radius:11px;padding:12px;margin-top:10px}.rows{display:grid;grid-template-columns:repeat(2,1fr);gap:7px 14px;font-size:15px}.rows strong{color:#a8beb8}.foot{margin-top:12px;display:flex;justify-content:space-between;gap:10px;font-size:13px}.media{min-height:260px;border-left:1px solid #173029;background:#030807;display:flex;align-items:center;justify-content:center;position:relative}.media a{width:100%;height:100%;min-height:260px;display:flex;align-items:center;justify-content:center}.media img{width:75%;height:auto;max-height:420px;object-fit:contain}.mb{position:absolute;right:9px;bottom:9px;font-size:11px;background:#07100fe8;border:1px solid #29433d;border-radius:99px;padding:5px 8px}.none{color:var(--muted);font-size:14px;padding:20px;text-align:center}.events{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.event{padding:12px 14px;display:grid;grid-template-columns:180px 110px 1fr auto;gap:12px}.etype{color:var(--info);font-weight:800}.health{margin-top:14px;color:var(--muted);font-size:13px;display:flex;justify-content:space-between}.error{padding:15px;border:1px solid #6b3030;background:#261111;border-radius:12px;color:#ffc4c4}@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.version{grid-template-columns:1fr}.media{border-left:0;border-top:1px solid #173029}.events{grid-template-columns:1fr}}@media(max-width:700px){.shell{padding:14px}.top{align-items:flex-start;flex-direction:column}.meta{text-align:left}.kpis{grid-template-columns:repeat(2,1fr)}.rows{grid-template-columns:1fr}.event{grid-template-columns:1fr}}
</style></head><body><div class="shell"><header class="top"><div class="brand"><div class="logo">ЖУГАН · IDEA RADAR</div><div class="live">● LIVE</div></div><div class="meta"><div id="updated">Загрузка…</div><a href="https://t.me/clubwinwin" target="_blank">Источник: @clubwinwin ↗</a></div></header><section class="kpis" id="kpis"></section><div id="error"></div><div class="title hot">Сигналы · актуальные группы и история</div><main class="groups" id="groups"><div class="none">Загрузка…</div></main><div class="title">Что изменилось · Telegram</div><section class="events" id="events"></section><div class="health"><span>Telegram → Setup History → Live State → Dashboard</span><span id="health">—</span></div></div><script>
const API='https://lfwvguwhdcobquyyaifl.supabase.co/functions/v1/zhugana-dashboard-public',DAY=864e5;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=t=>{try{return new Intl.DateTimeFormat('ru-RU',{timeZone:'Europe/Moscow',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(new Date(t))+' МСК'}catch{return'—'}};const val=v=>v&&v!=='UNSPECIFIED'?esc(v):'—';function rows(v){return [['Действие',v.action],['Статус входа',v.entry_status],['Зона входа',v.entry_area],['Цель',v.target_hint],['Уровень',v.level_hint],['Стоп',v.stop_hint],['Триггер',v.trigger_hint],['Инвалидация',v.invalidation_hint]].filter(x=>x[1]&&x[1]!=='UNSPECIFIED').map(x=>`<div><strong>${x[0]}:</strong> ${esc(x[1])}</div>`).join('')||'<div>Нет дополнительных полей</div>'}function media(v){if(v.media_type==='photo'&&v.media_url)return `<a href="${esc(v.media_url)}" target="_blank"><img src="${esc(v.media_url)}" loading="lazy" referrerpolicy="no-referrer"><span class="mb">${esc(v.media_quality||'MEDIA')} · открыть ↗</span></a>`;return `<div class="none">${v.media_type==='photo'?'Медиа недоступно':'Медиа нет'}</div>`}function version(v,i,s){const current=i===0&&Number(v.post_id)===Number(s.post_id);return `<article class="version ${current?'current':''}"><div class="copy"><div class="vhead"><div><div class="vtitle">#${v.post_id} · ${fmt(v.post_published_at)}</div><div class="label">${current?'Актуальная версия':'Предыдущая версия'}</div></div>${current?'<span class="current-tag">● АКТУАЛЬНО</span>':''}</div><div class="label">Оригинальный текст автора</div><div class="author">${esc(v.author_text||'Текст недоступен')}</div><div class="system"><div class="label">Системная интерпретация</div><div class="rows">${rows(v)}</div></div><div class="foot"><span>${val(v.direction)} · ${val(v.entry_status)}</span><a href="${esc(v.source_url)}" target="_blank">Telegram #${v.post_id} ↗</a></div></div><div class="media">${media(v)}</div></article>`}function group(s,now){const hs=(s.history||[]).slice().sort((a,b)=>new Date(b.post_published_at)-new Date(a.post_published_at)),fresh=s.post_published_at&&now-new Date(s.post_published_at).getTime()<=DAY;return `<section class="group ${fresh?'hot':''}"><header class="group-head"><div><div class="asset">${esc(s.asset)}</div><div class="label">${hs.length} ${hs.length===1?'версия':'версии'} · последняя ${fmt(s.post_published_at)}</div></div><div><span class="badge ${s.direction==='LONG'?'good':''}">${val(s.direction)}</span><span class="badge ${s.entry_status==='WAIT'?'warn':'good'}">${val(s.entry_status)}</span></div></header><div class="versions">${hs.map((v,i)=>version(v,i,s)).join('')}</div></section>`}function event(e){return `<article class="event"><span>${fmt(e.post_published_at)}</span><strong>${esc(e.asset)} · #${e.post_id}</strong><span class="etype">${esc(e.event_type)}</span><a href="${esc(e.source_url)}" target="_blank">Источник ↗</a></article>`}async function load(){try{const r=await fetch(API,{cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||r.status);const now=new Date(d.generated_at).getTime(),states=d.states||[],events=d.events||[];states.sort((a,b)=>new Date(b.post_published_at)-new Date(a.post_published_at));const sig=events.filter(e=>e.post_published_at&&now-new Date(e.post_published_at).getTime()<=DAY).length,active=states.filter(s=>!['CLOSED','AVOID'].includes(s.state_status)).length;document.querySelector('#updated').textContent=`Обновлено ${fmt(d.generated_at)} · канал #${d.latest_channel_post_id} · идея #${d.latest_idea_post_id}`;document.querySelector('#kpis').innerHTML=[['READY',states.filter(s=>s.entry_status==='READY'||s.state_status==='READY').length],['WAIT',states.filter(s=>s.entry_status==='WAIT').length],['WATCH',states.filter(s=>s.state_status==='WATCH').length],['CLOSED',states.filter(s=>s.state_status==='CLOSED').length],['SIGNALS 24H',sig],['ACTIVE',active]].map(x=>`<div class="kpi"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('');document.querySelector('#groups').innerHTML=states.map(s=>group(s,now)).join('');document.querySelector('#events').innerHTML=events.map(event).join('');const gd=states.find(s=>s.asset==='GD'),pass=gd&&gd.history?.length>=2&&gd.history[0].post_id===9130&&gd.history[1].post_id===9126;document.querySelector('#health').textContent=`API ${d.version} · groups ${states.length} · GD history ${gd?.history?.length||0} · ${pass?'R0.6.4 PASS':'CHECK'}`;document.querySelector('#error').innerHTML=pass?'':'<div class="error">⚠ Signal History acceptance check не пройден</div>'}catch(e){document.querySelector('#error').innerHTML=`<div class="error">Ошибка: ${esc(e.message)}</div>`}}load();setInterval(load,60000)</script></body></html>
