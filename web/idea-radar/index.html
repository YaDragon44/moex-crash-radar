<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ЖУГАН · IDEA RADAR</title><style>:root{color-scheme:dark;--bg:#07100f;--p:#0d1b18;--l:#203631;--t:#edf7f4;--m:#8ba59e;--r:#ff5e6c;--b:#77b9ff;--v:#b978ff;--g:#53e0a3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px Inter,system-ui}.s{max-width:1920px;margin:auto;padding:20px 24px}a{color:#9ed3ff;text-decoration:none}.top,.head,.logrow,.tabs,.stats{display:flex;justify-content:space-between;gap:14px;align-items:center}.logo{font-size:28px;font-weight:900}.meta,.muted{color:var(--m);font-size:13px}.tabs{justify-content:flex-start;margin:18px 0}.tab{border:1px solid var(--l);background:#0b1715;color:var(--m);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:800}.tab.active{color:#eadcff;border-color:#70439c;background:#21132e}.pane{display:none}.pane.active{display:block}.title{margin:20px 0 9px;font-weight:900;text-transform:uppercase;letter-spacing:.08em}.alerts,.cards{display:grid;gap:12px}.alert,.card,.log,.panel{border:1px solid var(--l);background:var(--p);border-radius:14px}.alert{padding:13px;border-left:5px solid var(--r)}.card{overflow:hidden}.head{padding:13px 16px;border-bottom:1px solid var(--l)}.asset{font-size:25px;font-weight:900}.tag{font-size:12px;border:1px solid #39534d;border-radius:99px;padding:5px 8px}.hist{display:flex;overflow-x:auto}.ver{flex:0 0 min(820px,70vw);padding:15px;border-right:1px solid var(--l)}.author{white-space:pre-wrap;line-height:1.45;margin:8px 0}.sys{font-size:13px;color:#b8ccc7}.log{overflow:hidden}.logrow{padding:10px 13px;border-bottom:1px solid #182a26;font-size:14px}.logrow:last-child{border:0}.logrow.purple{background:#1d1028;border-left:4px solid var(--v)}.logrow.blue{background:#0d1d2c;border-left:4px solid var(--b)}.time{width:145px;color:var(--m);flex:none}.etype{font-weight:850;width:220px}.msg{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.none{color:var(--m);padding:16px}.health{margin-top:14px;color:var(--m);font-size:12px}.stats{display:grid;grid-template-columns:repeat(6,1fr);margin-bottom:12px}.stat{padding:12px 14px}.stat b{display:block;font-size:24px}.panel{overflow:hidden}.ptable{width:100%;border-collapse:collapse}.ptable th,.ptable td{padding:10px 12px;border-bottom:1px solid #182a26;text-align:left}.ptable th{font-size:12px;color:var(--m);text-transform:uppercase}.ticker{color:#d8b2ff;font-weight:900}.target{color:#f0c86d;font-weight:900}.trade{display:grid;grid-template-columns:145px 80px 110px 1fr 120px 120px 120px auto;gap:10px;padding:10px 12px;border-bottom:1px solid #2e2040;align-items:center}.trade.buy{border-left:4px solid var(--g)}.trade.sell{border-left:4px solid var(--r)}.side{font-weight:900}.side.buy{color:var(--g)}.side.sell{color:var(--r)}@media(max-width:950px){.stats{grid-template-columns:repeat(3,1fr)}.trade{grid-template-columns:1fr 1fr}.top,.logrow{align-items:flex-start;flex-direction:column}.time,.etype{width:auto}.ver{flex-basis:90vw}}</style></head><body><div class="s"><div class="top"><div class="logo">ЖУГАН · IDEA RADAR</div><div class="meta" id="meta">Загрузка…</div></div><div class="tabs"><button class="tab active" data-tab="signals">Сигналы</button><button class="tab" data-tab="portfolio">Публичный портфель</button></div><section class="pane active" id="signals"><div class="alerts" id="alerts"></div><div class="title">Активные сигналы · TTL 3 часа</div><div class="cards" id="cards"></div><div class="title">Что изменилось · лог</div><div class="log" id="log"></div></section><section class="pane" id="portfolio"><div class="title">Публичный портфель · текущее состояние</div><div class="stats" id="pstats"></div><div class="panel"><table class="ptable"><thead><tr><th>Тикер</th><th>Актив</th><th>Количество</th><th>Ед.</th><th>Цель</th></tr></thead><tbody id="positions"></tbody></table></div><div class="title">История покупок / продаж</div><div class="panel" id="trades"></div></section><div class="health" id="health"></div></div><script>const API='https://lfwvguwhdcobquyyaifl.supabase.co/functions/v1/zhugana-dashboard-public',H=36e5,E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),F=t=>t?new Intl.DateTimeFormat('ru-RU',{timeZone:'Europe/Moscow',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(t))+' МСК':'—',N=n=>n==null?'—':new Intl.NumberFormat('ru-RU',{maximumFractionDigits:4}).format(Number(n));document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.pane').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelector('#'+b.dataset.tab).classList.add('active')});function ver(x){return `<div class="ver"><b>#${x.post_id} · ${F(x.post_published_at||x.published_at)}</b><div class="author">${E(x.author_text||'')}</div><div class="sys">${E([x.direction,x.action,x.entry_status,x.asset_normalized].filter(Boolean).join(' · '))}</div><a href="${E(x.source_url)}" target="_blank">Telegram ↗</a></div>`}function card(s){return `<section class="card"><div class="head"><div><div class="asset">${E(s.asset)}</div><div class="muted">${E([s.direction,s.entry_status,s.state_status].filter(Boolean).join(' · '))}</div></div><span class="tag">${E(s.entry_status||s.state_status||'SIGNAL')}</span></div><div class="hist">${(s.history||[]).map(ver).join('')}</div></section>`}function event(e){const cls=e.event_color==='PURPLE'?'purple':e.event_color==='BLUE'?'blue':'';return `<div class="logrow ${cls}"><span class="time">${F(e.post_published_at)}</span><span class="etype">${E(e.event_type)} · #${e.post_id}</span><span class="msg">${E(e.author_text||e.asset||'')}</span><a href="${E(e.source_url)}" target="_blank">↗</a></div>`}function trade(t){const sell=t.side==='SELL',detail=sell?`ср. покупка ${N(t.avg_buy_price)} ₽ · прибыль ${N(t.profit_pct)}% / ${N(t.profit_rub)} ₽`:`цель ${N(t.target)} ₽`;return `<div class="trade ${sell?'sell':'buy'}"><span>${F(t.published_at)}</span><span class="side ${sell?'sell':'buy'}">${E(t.side)}</span><span class="ticker">#${E(t.ticker)}</span><b>${E(t.name)}</b><span>${N(t.quantity)} акц.</span><span>${N(t.price)} ₽</span><span>${E(detail)}</span><a href="${E(t.source_url)}" target="_blank">Telegram ↗</a></div>`}async function load(){const r=await fetch(API,{cache:'no-store'}),d=await r.json();if(!d.ok)throw Error(d.error);const now=Date.parse(d.generated_at),fresh=t=>t&&now-Date.parse(t)>=0&&now-Date.parse(t)<3*H,states=(d.states||[]).filter(x=>fresh(x.post_published_at));document.querySelector('#meta').textContent=`${F(d.generated_at)} · канал #${d.latest_channel_post_id}`;document.querySelector('#alerts').innerHTML=(d.alerts||[]).map(a=>`<div class="alert"><b>⚠ ${E(a.alert_type)}</b><div>${E(a.author_text)}</div><a href="${E(a.source_url)}" target="_blank">Источник ↗</a></div>`).join('');document.querySelector('#cards').innerHTML=states.map(card).join('')||'<div class="none">Сейчас нет сигналов моложе 3 часов</div>';document.querySelector('#log').innerHTML=(d.events||[]).map(event).join('')||'<div class="none">Лог пуст</div>';const p=d.public_portfolio||{},s=p.snapshot||{};document.querySelector('#pstats').innerHTML=[['Неделя',s.week_no],['Внесено',N(s.contributed)+' ₽'],['Дивиденды',N(s.dividends)+' ₽'],['Стоимость',N(s.portfolio_value)+' ₽'],['Просадка',N(s.drawdown)+' ₽'],['Свободные деньги',N(s.free_cash)+' ₽']].map(x=>`<div class="panel stat"><b>${E(x[1])}</b><span class="muted">${E(x[0])}</span></div>`).join('');document.querySelector('#positions').innerHTML=(p.positions||[]).map(x=>`<tr><td class="ticker">#${E(x.ticker)}</td><td>${E(x.name)}</td><td>${N(x.quantity)}</td><td>${E(x.unit)}</td><td class="target">${x.target==null?'—':N(x.target)+' ₽'}</td></tr>`).join('')||'<tr><td colspan="5">Нет данных</td></tr>';document.querySelector('#trades').innerHTML=(p.trades||[]).map(trade).join('')||'<div class="none">История операций пуста</div>';document.querySelector('#health').textContent=`API ${d.version} · signal TTL 3h · portfolio target = latest known`; }load().catch(e=>document.querySelector('#health').textContent='Ошибка: '+e.message);setInterval(load,60000)</script></body></html>
