<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ЖУГАН · IDEA RADAR</title><style>
:root{color-scheme:dark;--panel:#0b1715;--panel2:#0e1e1b;--line:#203631;--text:#edf7f4;--muted:#8ba59e;--good:#53e0a3;--warn:#f0c86d;--info:#77b9ff;--danger:#ff5e6c}*{box-sizing:border-box}body{margin:0;background:#07100f;color:var(--text);font-family:Inter,system-ui,sans-serif;font-size:18px}.shell{max-width:1920px;margin:auto;padding:20px 24px 36px}a{color:#9ed3ff;text-decoration:none}.top{display:flex;justify-content:space-between;gap:16px;align-items:center}.brand{display:flex;gap:14px;align-items:center}.logo{font-size:29px;font-weight:900}.live{color:var(--good);border:1px solid #245941;border-radius:99px;padding:7px 11px;font-size:14px;font-weight:800}.meta{text-align:right;color:var(--muted);font-size:14px}.alerts{display:grid;gap:9px;margin:16px 0}.alert{background:linear-gradient(180deg,#351317,#220b0e);border:1px solid #8c3039;border-left:5px solid var(--danger);border-radius:12px;padding:13px 16px;display:grid;grid-template-columns:150px 1fr auto;gap:14px;align-items:center}.alert b{color:#ff9aa3}.alert .msg{white-space:pre-wrap;font-size:15px}.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:16px 0}.kpi,.group,.event{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px}.kpi{padding:13px 15px}.kpi b{display:block;font-size:30px}.kpi span,.label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}.title{margin:20px 0 10px;font-size:16px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#a9c1ba}.title.hot{color:var(--good)}.groups{display:grid;gap:16px}.group{overflow:hidden}.group.hot{border-color:#2d6c55}.group-head{padding:13px 16px;border-bottom:1px solid #173029;display:flex;justify-content:space-between;align-items:center}.asset{font-size:26px;font-weight:900}.badge{font-size:12px;padding:5px 8px;border:1px solid #2a453e;border-radius:99px;margin-left:5px}.good{color:var(--good)}.warn{color:var(--warn)}.versions{display:flex;overflow-x:auto;align-items:stretch;scroll-snap-type:x proximity}.version{flex:0 0 min(896px,70vw);display:grid;grid-template-columns:minmax(0,55%) minmax(0,45%);border-right:1px solid #173029;scroll-snap-align:start;position:relative}.version.current{background:rgba(83,224,163,.045);box-shadow:inset 4px 0 0 var(--good)}.copy{padding:14px 16px;min-width:0}.vhead{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px}.vtitle{font-size:15px;font-weight:850}.current-tag{color:var(--good);font-size:11px;font-weight:900}.author{white-space:pre-wrap;font-size:15px;line-height:1.45;margin:6px 0 11px}.system{background:#0c211c;border:1px solid #21443a;border-radius:9px;padding:10px;margin-top:8px}.rows{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 11px;font-size:12px}.rows strong{color:#a8beb8}.foot{margin-top:10px;display:flex;justify-content:space-between;gap:8px;font-size:12px}.media{min-width:0;border-left:1px solid #173029;background:#030807;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:10px}.media a{width:100%;height:100%;display:flex;align-items:center;justify-content:center;line-height:0}.media img{width:auto;height:auto;max-width:100%;max-height:100%;display:block;object-fit:contain}.mb{position:absolute;right:7px;bottom:7px;font-size:10px;background:#07100fe8;border:1px solid #29433d;border-radius:99px;padding:4px 6px}.none{width:100%;color:var(--muted);font-size:12px;padding:16px;text-align:center}.events{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.event{padding:12px 14px;display:grid;grid-template-columns:180px 110px 1fr auto;gap:12px}.event.review{background:linear-gradient(180deg,#10253b,#0a1929);border-color:#285b89}.event.review .etype{color:#77b9ff}.etype{color:var(--info);font-weight:800}.health{margin-top:14px;color:var(--muted);font-size:13px;display:flex;justify-content:space-between}.error{padding:15px;border:1px solid #6b3030;background:#261111;border-radius:12px;color:#ffc4c4}@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.version{flex-basis:75vw;grid-template-columns:52% 48%}.events{grid-template-columns:1fr}.alert{grid-template-columns:130px 1fr auto}}@media(max-width:700px){.shell{padding:14px}.top{align-items:flex-start;flex-direction:column}.meta{text-align:left}.kpis{grid-template-columns:repeat(2,1fr)}.version{flex-basis:90vw;grid-template-columns:1fr}.media{border-left:0;border-top:1px solid #173029;min-height:220px}.media img{max-height:420px}.rows{grid-template-columns:1fr}.event,.alert{grid-template-columns:1fr}}
</style></head><body><div class="shell"><header class="top"><div class="brand"><div class="logo">ЖУГАН · IDEA RADAR</div><div class="live">● LIVE</div></div><div class="meta"><div id="updated">Загрузка…</div><a href="https://t.me/clubwinwin" target="_blank">Источник: @clubwinwin ↗</a></div></header><section class="alerts" id="alerts"></section><section class="kpis" id="kpis"></section><div id="error"></div><div class="title hot">Сигналы · горизонтальная история →</div><main class="groups" id="groups"><div class="none">Загрузка…</div></main><div class="title">Что изменилось · Telegram</div><section class="events" id="events"></section><div class="health"><span>Telegram → Alerts / Setup History → Live State → Dashboard</span><span id="health">—</span></div></div><script>
const API='https://lfwvguwhdcobquyyaifl.supabase.co/functions/v1/zhugana-dashboard-public',DAY=864e5;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=t=>{if(!t)return'—';try{return new Intl.DateTimeFormat('ru-RU',{timeZone:'Europe/Moscow',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(new Date(t))+' МСК'}catch{return'—'}};const val=v=>v&&v!=='UNSPECIFIED'?esc(v):'—';function rows(v){return [['Действие',v.action],['Статус входа',v.entry_status],['Зона входа',v.entry_area],['Цель',v.target_hint],['Уровень',v.level_hint],['Стоп',v.stop_hint],['Триггер',v.trigger_hint],['Инвалидация',v.invalidation_hint]].filter(x=>x[1]&&x[1]!=='UNSPECIFIED').map(x=>`<div><strong>${x[0]}:</strong> ${esc(x[1])}</div>`).join('')||'<div>Нет дополнительных полей</div>'}function media(v){if(v.media_type==='photo'&&v.media_url)return `<a href="${esc(v.media_url)}" target="_blank"><img src="${esc(v.media_url)}" loading="lazy" referrerpolicy="no-referrer"><span class="mb">ORIGINAL · открыть ↗</span></a>`;return `<div class="none">${v.media_type==='photo'?'Медиа недоступно':'Медиа нет'}</div>`}function version(v,i,s){const current=i===0&&Number(v.post_id)===Number(s.post_id);return `<article class="version ${current?'current':''}"><div class="copy"><div class="vhead"><div><div class="vtitle">#${v.post_id} · ${fmt(v.post_published_at)}</div><div class="label">${current?'Актуальная версия':'Предыдущая версия'}</div></div>${current?'<span class="current-tag">● АКТУАЛЬНО</span>':''}</div><div class="label">Оригинальный текст автора</div><div class="author">${esc(v.author_text||'Текст недоступен')}</div><div class="system"><div class="label">Системная интерпретация</div><div class="rows">${rows(v)}</div></div><div class="foot"><span>${val(v.direction)} · ${val(v.entry_status)}</span><a href="${esc(v.source_url)}" target="_blank">Telegram #${v.post_id} ↗</a></div></div><div class="media">${media(v)}</div></article>`}function group(s,now){const hs=(s.history||[]).slice().sort((a,b)=>new Date(b.post_published_at||0)-new Date(a.post_published_at||0)),fresh=s.post_published_at&&now-new Date(s.post_published_at).getTime()<=DAY;if(!hs.length)return'';return `<section class="group ${fresh?'hot':''}"><header class="group-head"><div><div class="asset">${esc(s.asset)}</div><div class="label">${hs.length} ${hs.length===1?'версия':'версии'} · слева актуальная → справа история · последняя ${fmt(hs[0].post_published_at)}</div></div><div><span class="badge ${s.direction==='LONG'?'good':''}">${val(s.direction)}</span><span class="badge ${s.entry_status==='WAIT'?'warn':'good'}">${val(s.entry_status)}</span></div></header><div class="versions">${hs.map((v,i)=>version(v,i,s)).join('')}</div></section>`}function alertCard(a){return `<article class="alert"><b>⚠ ${a.alert_type==='CLOSE_SPEC_LONGS'?'ЗАКРЫТИЕ ЛОНГОВ':'ПРЕДУПРЕЖДЕНИЕ'}</b><div><div class="msg">${esc(a.author_text)}</div><div class="label">${fmt(a.post_published_at)} · Telegram #${a.post_id}</div></div><a href="${esc(a.source_url)}" target="_blank">Источник ↗</a></article>`}function event(e){const review=e.event_type==='KEY_ASSETS_REVIEW';return `<article class="event ${review?'review':''}"><span>${fmt(e.post_published_at)}</span><strong>${review?'ОБЗОР':esc(e.asset||'—')} · #${e.post_id}</strong><span class="etype">${review?'ОБЗОР КЛЮЧЕВЫХ АКТИВОВ':esc(e.event_type)}</span><a href="${esc(e.source_url)}" target="_blank">Telegram ↗</a></article>`}async function load(){try{const r=await fetch(API,{cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||r.status);const now=new Date(d.generated_at).getTime(),states=d.states||[],events=d.events||[],alerts=d.alerts||[];states.sort((a,b)=>new Date(b.post_published_at||0)-new Date(a.post_published_at||0));document.querySelector('#alerts').innerHTML=alerts.map(alertCard).join('');const sig=events.filter(e=>e.post_published_at&&now-new Date(e.post_published_at).getTime()<=DAY&&e.event_type!=='KEY_ASSETS_REVIEW').length,active=states.filter(s=>!['CLOSED','AVOID'].includes(s.state_status)).length;document.querySelector('#updated').textContent=`Обновлено ${fmt(d.generated_at)} · канал #${d.latest_channel_post_id} · идея #${d.latest_idea_post_id}`;document.querySelector('#kpis').innerHTML=[['ALERTS',alerts.length],['READY',states.filter(s=>s.entry_status==='READY'||s.state_status==='READY').length],['WAIT',states.filter(s=>s.entry_status==='WAIT').length],['WATCH',states.filter(s=>s.state_status==='WATCH').length],['SIGNALS 24H',sig],['ACTIVE',active]].map(x=>`<div class="kpi"><b>${x[1]}</b><span>${x[0]}</span></div>`).join('');document.querySelector('#groups').innerHTML=states.map(s=>group(s,now)).join('');document.querySelector('#events').innerHTML=events.map(event).join('');document.querySelector('#health').textContent=`API ${d.version} · alerts ${alerts.length} · reviews history-only · R0.6.6`;document.querySelector('#error').innerHTML=''}catch(e){document.querySelector('#error').innerHTML=`<div class="error">Ошибка: ${esc(e.message)}</div>`}}load();setInterval(load,60000)</script></body></html>
