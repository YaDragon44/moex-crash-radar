<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ЖУГАН · IDEA RADAR</title><style>:root{color-scheme:dark;--bg:#07100f;--p:#0d1b18;--l:#203631;--t:#edf7f4;--m:#8ba59e;--g:#53e0a3;--r:#ff5e6c;--b:#77b9ff;--v:#b978ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:17px Inter,system-ui}.s{max-width:1920px;margin:auto;padding:20px 24px}a{color:#9ed3ff;text-decoration:none}.top,.head,.logrow{display:flex;justify-content:space-between;gap:14px;align-items:center}.logo{font-size:28px;font-weight:900}.meta,.muted{color:var(--m);font-size:13px}.title{margin:20px 0 9px;font-weight:900;text-transform:uppercase;letter-spacing:.08em}.alerts,.cards{display:grid;gap:12px}.alert,.card,.log{border:1px solid var(--l);background:var(--p);border-radius:14px}.alert{padding:13px;border-left:5px solid var(--r)}.card{overflow:hidden}.card.purple{border-color:#70439c;background:linear-gradient(180deg,#21132e,#100b18)}.head{padding:13px 16px;border-bottom:1px solid var(--l)}.asset{font-size:25px;font-weight:900}.purple .asset,.purple .tag{color:#d8b2ff}.tag{font-size:12px;border:1px solid #39534d;border-radius:99px;padding:5px 8px}.hist{display:flex;overflow-x:auto}.ver{flex:0 0 min(820px,70vw);padding:15px;border-right:1px solid var(--l)}.author{white-space:pre-wrap;line-height:1.45;margin:8px 0}.sys{font-size:13px;color:#b8ccc7}.log{overflow:hidden}.logrow{padding:10px 13px;border-bottom:1px solid #182a26;font-size:14px}.logrow:last-child{border:0}.logrow.purple{background:#1d1028;border-left:4px solid var(--v)}.logrow.blue{background:#0d1d2c;border-left:4px solid var(--b)}.time{width:145px;color:var(--m);flex:none}.etype{font-weight:850;width:220px}.msg{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.none{color:var(--m);padding:16px}.health{margin-top:14px;color:var(--m);font-size:12px}.expired{display:none}@media(max-width:800px){.top,.logrow{align-items:flex-start;flex-direction:column}.time,.etype{width:auto}.ver{flex-basis:90vw}}</style></head><body><div class="s"><div class="top"><div class="logo">ЖУГАН · IDEA RADAR</div><div class="meta" id="meta">Загрузка…</div></div><div class="alerts" id="alerts"></div><div class="title">Активные сигналы · TTL 3 часа</div><div class="cards" id="cards"></div><div class="title">#публичныйпортфель</div><div class="cards" id="portfolio"></div><div class="title">Что изменилось · лог</div><div class="log" id="log"></div><div class="health" id="health"></div></div><script>const API='https://lfwvguwhdcobquyyaifl.supabase.co/functions/v1/zhugana-dashboard-public',H=36e5,E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),F=t=>t?new Intl.DateTimeFormat('ru-RU',{timeZone:'Europe/Moscow',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(t))+' МСК':'—';function ver(x){return `<div class="ver"><b>#${x.post_id} · ${F(x.post_published_at||x.published_at)}</b><div class="author">${E(x.author_text||'')}</div><div class="sys">${E([x.direction,x.action,x.entry_status,x.asset_normalized].filter(Boolean).join(' · '))}</div><a href="${E(x.source_url)}" target="_blank">Telegram ↗</a></div>`}function card(s,p=false){const hs=p?[s]:(s.history||[]);return `<section class="card ${p?'purple':''}"><div class="head"><div><div class="asset">${E(p?'ПУБЛИЧНЫЙ ПОРТФЕЛЬ':s.asset)}</div><div class="muted">${p?E([s.asset_normalized,s.action,s.quantity&&s.quantity+' шт.',s.price&&s.price+' ₽'].filter(Boolean).join(' · ')):E([s.direction,s.entry_status,s.state_status].filter(Boolean).join(' · '))}</div></div><span class="tag">${p?'PORTFOLIO':E(s.entry_status||s.state_status||'SIGNAL')}</span></div><div class="hist">${hs.map(ver).join('')}</div></section>`}function event(e){const cls=e.event_color==='PURPLE'?'purple':e.event_color==='BLUE'?'blue':'';return `<div class="logrow ${cls}"><span class="time">${F(e.post_published_at)}</span><span class="etype">${E(e.event_type)} · #${e.post_id}</span><span class="msg">${E(e.author_text||e.asset||'')}</span><a href="${E(e.source_url)}" target="_blank">↗</a></div>`}async function load(){const r=await fetch(API,{cache:'no-store'}),d=await r.json();if(!d.ok)throw Error(d.error);const now=Date.parse(d.generated_at),fresh=(t)=>t&&now-Date.parse(t)>=0&&now-Date.parse(t)<3*H,states=(d.states||[]).filter(x=>fresh(x.post_published_at)),pf=(d.portfolio_actions||[]).filter(x=>fresh(x.post_published_at));document.querySelector('#meta').textContent=`${F(d.generated_at)} · канал #${d.latest_channel_post_id}`;document.querySelector('#alerts').innerHTML=(d.alerts||[]).map(a=>`<div class="alert"><b>⚠ ${E(a.alert_type)}</b><div>${E(a.author_text)}</div><a href="${E(a.source_url)}" target="_blank">Источник ↗</a></div>`).join('');document.querySelector('#cards').innerHTML=states.map(x=>card(x)).join('')||'<div class="none">Сейчас нет сигналов моложе 3 часов</div>';document.querySelector('#portfolio').innerHTML=pf.map(x=>card(x,true)).join('')||'<div class="none">Нет новых действий #публичныйпортфель за последние 3 часа</div>';document.querySelector('#log').innerHTML=(d.events||[]).map(event).join('')||'<div class="none">Лог пуст</div>';document.querySelector('#health').textContent=`API ${d.version} · signal TTL ${d.signal_ttl_hours}h · alerts TTL unchanged`; }load().catch(e=>document.querySelector('#health').textContent='Ошибка: '+e.message);setInterval(load,60000)</script></body></html>
