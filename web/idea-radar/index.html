04em}.sub{color:var(--muted);font-size:14px;margin-top:3px}.chips{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:7px}.chip{padding:7px 10px;border:1px solid #2a453e;background:var(--chip);border-radius:999px;font-size:14px;font-weight:750}.ready,.long{color:var(--good)}.wait{color:var(--warn)}.closed,.avoid,.short{color:var(--bad)}.unspecified{color:var(--muted)}.card-body{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(300px,.9fr)}.content{padding:18px 20px}.media{border-left:1px solid #173029;min-height:320px;background:#050c0b;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.media>a{display:flex;width:100%;height:100%;min-height:320px;align-items:center;justify-content:center;position:relative;background:#030807}.media img{width:100%;height:100%;max-height:620px;min-height:320px;object-fit:contain;display:block}.media-badge{position:absolute;right:10px;bottom:10px;background:rgba(3,8,7,.86);border:1px solid #29433d;border-radius:999px;padding:6px 9px;font-size:12px;color:#cfe2dd;z-index:2}.media .none{padding:20px;text-align:center;color:var(--muted);font-size:14px}.label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;font-weight:800;margin-bottom:6px}.author{white-space:pre-wrap;font-size:20px;line-height:1.55;margin:0 0 14px}.system{background:#0c211c;border:1px solid #21443a;border-radius:12px;padding:13px 14px;margin-top:12px}.system-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px}.row{font-size:16px}.row strong{color:#a8beb8;font-weight:650}.footer{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;padding-top:12px;border-top:1px solid #173029}.fidelity{display:flex;gap:6px;flex-wrap:wrap}.fid{font-size:11px;padding:4px 7px;border-radius:999px;border:1px solid #2a453e;color:var(--muted)}.fid.ok{color:var(--good);border-color:#285641}.fid.warn{color:var(--warn);border-color:#5c4f29}.changes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.event{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:180px 120px 1fr auto;align-items:center;gap:12px}.event time{color:#a8beb8;font-variant-numeric:tabular-nums}.etype{font-weight:800;color:var(--info)}.empty{border:1px dashed var(--line);border-radius:14px;padding:24px;color:var(--muted);text-align:center}.health{margin-top:14px;display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:13px}.error{padding:18px;border:1px solid #6b3030;background:#261111;border-radius:12px;color:#ffc4c4;margin:14px 0}@media(max-width:1180px){.kpis{grid-template-columns:repeat(3,1fr)}.ideas{grid-template-columns:1fr}.event{grid-template-columns:150px 110px 1fr}.event a{grid-column:3}}@media(max-width:720px){body{font-size:16px}.shell{padding:14px}.top{align-items:flex-start;flex-direction:column}.meta{text-align:left}.kpis{grid-template-columns:repeat(2,1fr)}.card-body{grid-template-columns:1fr}.media{border-left:0;border-top:1px solid #173029}.event{grid-template-columns:1fr}.changes{grid-template-columns:1fr}.system-grid{grid-template-columns:1fr}}
</style></head><body><div class="shell"><header class="top"><div class="brand"><div class="logo">ЖУГАН · IDEA RADAR</div><div class="live"><i class="dot"></i> LIVE</div></div><div class="meta"><div id="updated">Загрузка…</div><div><a href="https://t.me/clubwinwin" target="_blank" rel="noopener">Источник: @clubwinwin ↗</a></div></div></header><section class="kpis" id="kpis"></section><div id="error"></div><div class="section-title">Активные идеи · сверка с Telegram</div><main class="ideas" id="ideas"><div class="empty">Загружаю live-данные…</div></main><div class="section-title">Что изменилось · время публикации Telegram</div><section class="changes" id="changes"></section><div class="health"><span>Telegram → Supabase → Live State → Dashboard</span><span id="health">—</span></div></div>
<script>
const API='https://lfwvguwhdcobquyyaifl.supabase.co/functions/v1/zhugana-dashboard-public';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=t=>{if(!t)return'время недоступно';try{return new Intl.DateTimeFormat('ru-RU',{timeZone:'Europe/Moscow',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(new Date(t))+' МСК'}catch{return t}};const cls=s=>String(s||'').toLowerCase().replace(/[^a-z_]/g,'');const val=v=>v&&v!=='UNSPECIFIED'?esc(v):'—';function priority(s){if(s.state_status==='READY'||s.entry_status==='READY')return 0;if(s.entry_status==='NOT_READY')return 1;if(s.entry_status==='WAIT'||s.state_status==='WATCH')return 2;if(s.state_status==='OBSERVING')return 3;if(s.state_status==='AVOID')return 4;if(s.state_status==='CLOSED')return 5;return 6}function systemRows(s){const rows=[['Действие',s.action],['Статус входа',s.entry_status],['Зона входа',s.entry_area],['Цель',s.target_hint],['Уровень',s.level_hint],['Стоп',s.stop_hint],['Триггер',s.trigger_hint],['Инвалидация',s.invalidation_hint]];return rows.filter(x=>x[1]&&x[1]!=='UNSPECIFIED').map(([k,v])=>`<div class="row"><strong>${esc(k)}:</strong> ${esc(v)}</div>`).join('')||'<div class="row">Нет дополнительных нормализованных полей</div>'}function media(s){if(s.media_type==='photo'&&s.media_url){const badge=s.media_quality==='MEDIA_HIGH_RES'?'HIGH RES · открыть':'PREVIEW · открыть';return `<a href="${esc(s.media_url)}" target="_blank" rel="noopener" title="Открыть график в полном размере"><img src="${esc(s.media_url)}" alt="График из Telegram post ${esc(s.post_id)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentElement.outerHTML='<div class=&quot;none&quot;>⚠ График сейчас недоступен · откройте Telegram</div>'"><span class="media-badge">${badge} ↗</span></a>`}if(s.media_type==='photo')return'<div class="none">⚠ В исходном посте есть график, но медиа сейчас недоступно · откройте Telegram</div>';if(s.media_type==='video')return'<div class="none">▶ В исходном посте видео · откройте источник</div>';return'<div class="none">Медиа в исходном посте нет</div>'}function card(s){const f=s.fidelity||{},mq=f.media_status||'MEDIA ?';const mediaGood=mq==='MEDIA_HIGH_RES';return `<article class="card"><div class="card-head"><div><div class="asset">${esc(s.asset)}</div><div class="sub">Telegram post #${esc(s.post_id)} · ${fmt(s.post_published_at)}</div></div><div class="chips"><span class="chip ${cls(s.direction)}">${val(s.direction)}</span><span class="chip ${cls(s.state_status)}">${val(s.state_status)}</span><span class="chip ${cls(s.entry_status)}">${val(s.entry_status)}</span></div></div><div class="card-body"><div class="content"><div class="label">Оригинальный текст автора</div><div class="author">${esc(s.author_text||'Текст источника недоступен')}</div><div class="system"><div class="label">Системная интерпретация</div><div class="system-grid">${systemRows(s)}</div></div><div class="footer"><div class="fidelity"><span class="fid ${f.text_ok?'ok':'warn'}">${f.text_ok?'TEXT OK':'TEXT ?'}</span><span class="fid ${mediaGood?'ok':'warn'}">${esc(mq)}</span><span class="fid ${f.source_link_ok?'ok':'warn'}">${f.source_link_ok?'SOURCE LINK OK':'SOURCE LINK ?'}</span></div><a href="${esc(s.source_url)}" target="_blank" rel="noopener">Открыть оригинал ↗</a></div></div><div class="media">${media(s)}</div></div></article>`}function kpis(states,events){const active=states.filter(s=>!['CLOSED','AVOID'].includes(s.state_status)),now=Date.now(),day=864e5,data=[['READY',states.filter(s=>s.state_status==='READY'||s.entry_status==='READY').length],['WAIT',states.filter(s=>s.entry_status==='WAIT').length],['WATCH',states.filter(s=>s.state_status==='WATCH').length],['CLOSED',states.filter(s=>s.state_status==='CLOSED').length],['NEW 24H',events.filter(e=>e.event_type==='NEW_IDEA'&&e.post_published_at&&(now-new Date(e.post_published_at).getTime())<=day).length],['ACTIVE',active.length]];document.querySelector('#kpis').innerHTML=data.map(([l,n])=>`<div class="kpi"><b>${n}</b><span>${l}</span></div>`).join('')}function eventRow(e){return `<article class="event"><time>${fmt(e.post_published_at)}</time><div><strong>${esc(e.asset)}</strong> · #${esc(e.post_id)}</div><div class="etype">${esc(e.event_type)}</div><a href="${esc(e.source_url)}" target="_blank" rel="noopener">Источник ↗</a></article>`}async function load(){try{const r=await fetch(API,{cache:'no-store'}),d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||`HTTP ${r.status}`);const states=(d.states||[]).sort((a,b)=>priority(a)-priority(b)||new Date(b.post_published_at)-new Date(a.post_published_at)),events=d.events||[];document.querySelector('#updated').textContent=`Обновлено ${fmt(d.generated_at)} · канал #${d.latest_channel_post_id??'—'} · идея #${d.latest_idea_post_id??'—'}`;kpis(states,events);document.querySelector('#ideas').innerHTML=states.length?states.map(card).join(''):'<div class="empty">Идей нет</div>';document.querySelector('#changes').innerHTML=events.length?events.map(eventRow).join(''):'<div class="empty">Изменений нет</div>';const gd=states.find(x=>x.post_id===9130&&x.asset==='GD'),gdOk=gd&&gd.author_text==='#gd Гипотеза в золоте пока подтверждается ☺️\n\nЖду завершение коррекции и ищу вход в лонг 🪄'&&gd.direction==='LONG'&&gd.entry_status==='WAIT'&&gd.source_url==='https://t.me/clubwinwin/9130',hq=states.filter(x=>x.media_type==='photo'&&x.media_quality==='MEDIA_HIGH_RES').length;document.querySelector('#health').textContent=`API ${d.version||'OK'} · states ${states.length} · HIGH RES ${hq} · GD9130 ${gdOk?'PASS':'CHECK'}`;document.querySelector('#error').innerHTML=gdOk?'':'<div class="error">⚠ Acceptance GD #9130 не прошёл полностью.</div>'}catch(e){document.querySelector('#error').innerHTML=`<div class="error">Ошибка live-данных: ${esc(e.message||e)}</div>`;document.querySelector('#ideas').innerHTML='<div class="empty">Live API недоступен</div>';document.querySelector('#health').textContent='API ERROR'}}load();setInterval(load,60000);
</script></body></html>
